<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">Weave</title>
  <desc id="desc">Premium Weave interlaced thread app icon.</desc>
