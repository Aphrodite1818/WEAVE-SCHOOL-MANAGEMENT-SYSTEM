version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nhs_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nhs_backend
    ports:
      - "8080:8080"
    env_file:
      - backend/.env
      - backend/.env.staging
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped
