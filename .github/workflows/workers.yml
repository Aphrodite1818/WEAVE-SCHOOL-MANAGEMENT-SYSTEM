name: Workers

on:
  pull_request:
    paths:
      - "backend/app/core/queue/**"
      - "backend/app/modules/bulk_imports/**"
      - "backend/app/modules/communications/**"
      - "backend/app/modules/student_academics/session_closure_service.py"
      - "backend/tests/unit/bulk_imports/**"
      - "backend/tests/unit/communications/**"
      - "backend/tests/unit/test_worker_settings.py"
      - ".github/workflows/workers.yml"
  push:
    branches:
      - Attendance
      - staging
      - master
    paths:
      - "backend/app/core/queue/**"
      - "backend/app/modules/bulk_imports/**"
      - "backend/app/modules/communications/**"
      - "backend/app/modules/student_academics/session_closure_service.py"
      - "backend/tests/unit/bulk_imports/**"
      - "backend/tests/unit/communications/**"
      - "backend/tests/unit/test_worker_settings.py"
      - ".github/workflows/workers.yml"

jobs:
  validate-workers:
    runs-on: ubuntu-latest

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Import all worker settings
        run: |
          uv run python - <<'PY'
          from app.core.queue.attendance_worker import WorkerSettings as AttendanceWorker
          from app.core.queue.bulk_import_worker import WorkerSettings as BulkImportWorker
          from app.core.queue.email_worker import WorkerSettings as EmailWorker
          from app.core.queue.progression_worker import WorkerSettings as ProgressionWorker

          workers = (
              AttendanceWorker,
              BulkImportWorker,
              EmailWorker,
              ProgressionWorker,
          )
          for worker in workers:
              assert worker.functions
              print(worker.queue_name, [function.__name__ for function in worker.functions])
          PY

      - name: Run worker regression tests
        run: |
          uv run pytest \
            tests/unit/test_worker_settings.py \
            tests/unit/bulk_imports/test_stale_import_recovery.py \
            tests/unit/communications/test_notification_service.py \
            -q
