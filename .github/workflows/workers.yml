name: Workers

on:
  pull_request:
    paths:
      - "backend/app/core/queue/**"
      - "backend/app/modules/bulk_imports/**"
      - "backend/app/modules/communications/**"
      - "backend/app/modules/email_outbox/**"
      - "backend/app/modules/subscriptions/**"
      - "backend/app/modules/student_academics/session_closure_service.py"
      - "backend/tests/unit/bulk_imports/**"
      - "backend/tests/unit/communications/**"
      - "backend/tests/unit/queue/**"
      - "backend/tests/unit/test_worker_settings.py"
      - ".github/workflows/workers.yml"
  push:
    branches:
      - production-hardening
      - staging
      - master
    paths:
      - "backend/app/core/queue/**"
      - "backend/app/modules/bulk_imports/**"
      - "backend/app/modules/communications/**"
      - "backend/app/modules/email_outbox/**"
      - "backend/app/modules/subscriptions/**"
      - "backend/app/modules/student_academics/session_closure_service.py"
      - "backend/tests/unit/bulk_imports/**"
      - "backend/tests/unit/communications/**"
      - "backend/tests/unit/queue/**"
      - "backend/tests/unit/test_worker_settings.py"
      - ".github/workflows/workers.yml"

permissions:
  contents: read

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workers:
    runs-on: ubuntu-latest

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Import worker settings
        run: |
          uv run python - <<'PY'
          from app.core.queue.general_worker import WorkerSettings as GeneralWorker
          from app.core.queue.heavy_worker import WorkerSettings as HeavyWorker

          workers = (GeneralWorker, HeavyWorker)
          for worker in workers:
              assert worker.functions
              assert worker.health_check_key
              print(worker.queue_name, [function.__name__ for function in worker.functions])

          assert GeneralWorker.max_jobs == 3
          assert HeavyWorker.max_jobs == 1
          PY

      - name: Run worker regression tests
        run: |
          uv run pytest \
            tests/unit/queue/test_arq_queue_separation.py \
            tests/unit/bulk_imports/test_stale_import_recovery.py \
            tests/unit/communications/test_notification_service.py \
            -q
