name: Patch subscription edge cases

on:
  push:
    branches:
      - Attendance
    paths:
      - ".github/workflows/patch-subscription-edge-cases.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Attendance
          fetch-depth: 0

      - name: Apply focused patches
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("backend/app/modules/subscriptions/service.py")
          text = service.read_text()
          old = """        subscription.status = SubscriptionStatus.GRACE_PERIOD\n        subscription.grace_ends_at = now + timedelta(days=grace_days)\n        subscription.notes = _append_note(subscription.notes, notes)\n"""
          new = """        subscription.status = SubscriptionStatus.GRACE_PERIOD\n        if subscription.grace_ends_at is None:\n            subscription.grace_ends_at = now + timedelta(days=grace_days)\n        subscription.notes = _append_note(subscription.notes, notes)\n"""
          if old not in text:
              raise SystemExit("Grace-period target block not found")
          service.write_text(text.replace(old, new, 1))

          teacher = Path("frontend/src/pages/teacher/ResultsPage.jsx")
          text = teacher.read_text()
          old = "          subscriptionService.getActorEntitlements(),\n"
          new = "          subscriptionService.getActorEntitlements().catch(() => null),\n"
          if old not in text:
              raise SystemExit("Teacher entitlement target call not found")
          teacher.write_text(text.replace(old, new, 1))
          PY

      - name: Format backend patch
        run: |
          python -m pip install ruff
          ruff format backend/app/modules/subscriptions/service.py

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/subscriptions/service.py frontend/src/pages/teacher/ResultsPage.jsx
          git commit -m "fix: preserve grace deadline and teacher workspace resilience"
          git push origin HEAD:Attendance
