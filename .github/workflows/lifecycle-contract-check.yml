name: Lifecycle Contract Check

on:
  push:
    branches:
      - fix/lifecycle-contract-hardening
  pull_request:
    branches:
      - student_lifecycle

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, contracts, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

  backend:
    name: Backend lifecycle imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --group dev --frozen

      - name: Compile backend modules
        run: uv run python -m compileall -q app

      - name: Run lifecycle contract tests
        run: uv run pytest tests/test_lifecycle_contract_imports.py -q
