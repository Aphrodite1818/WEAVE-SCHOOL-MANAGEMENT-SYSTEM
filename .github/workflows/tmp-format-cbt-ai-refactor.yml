name: Temporary CBT AI refactor formatter

on:
  push:
    branches:
      - refactor/cbt-ai-domain-layout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cbt-ai-domain-layout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Format CBT AI refactor files
        run: |
          uv run ruff format \
            app/modules/cbt/ai/authoring/contracts.py \
            app/modules/cbt/ai/authoring/providers/factory.py \
            app/modules/cbt/ai/authoring/providers/gemini.py \
            app/modules/cbt/ai/authoring/providers/minimax.py \
            app/modules/cbt/ai/authoring/schemas.py \
            app/modules/cbt/ai/authoring/service.py \
            app/modules/cbt/ai/authoring/validation.py \
            app/modules/cbt/ai/quota/repository.py \
            app/modules/cbt/ai/quota/service.py \
            tests/unit/cbt/ai/authoring/test_validation.py \
            tests/unit/cbt/ai/quota/test_service.py
      - name: Commit formatted files and remove temporary workflow
        working-directory: .
        run: |
          git rm .github/workflows/tmp-format-cbt-ai-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "format CBT AI domain refactor"
          git push origin HEAD:refactor/cbt-ai-domain-layout
