name: Guides and searchable filters

on:
  pull_request:
    paths:
      - "backend/app/modules/user_guides/**"
      - "backend/alembic/versions/20260801_user_guides.py"
      - "backend/app/models.py"
      - "backend/app/main.py"
      - "backend/tests/unit/user_guides/**"
      - "frontend/src/components/ui/SearchableSelect.jsx"
      - "frontend/src/components/guides/**"
      - "frontend/src/features/guides/**"
      - "frontend/src/services/guideService.js"
      - "frontend/src/components/academic/AcademicSelectors.jsx"
      - "frontend/src/features/academic-admin/**"
      - "frontend/src/pages/teacher/ResultsPage.jsx"
      - "frontend/src/pages/admin/AdminDashboardPage.jsx"
      - "frontend/src/components/layout/DashboardLayout.jsx"
      - ".github/workflows/guides-searchable.yml"
  push:
    branches:
      - Attendance
      - staging
      - master
    paths:
      - "backend/app/modules/user_guides/**"
      - "backend/alembic/versions/20260801_user_guides.py"
      - "backend/app/models.py"
      - "backend/app/main.py"
      - "backend/tests/unit/user_guides/**"
      - "frontend/src/components/ui/SearchableSelect.jsx"
      - "frontend/src/components/guides/**"
      - "frontend/src/features/guides/**"
      - "frontend/src/services/guideService.js"
      - "frontend/src/components/academic/AcademicSelectors.jsx"
      - "frontend/src/features/academic-admin/**"
      - "frontend/src/pages/teacher/ResultsPage.jsx"
      - "frontend/src/pages/admin/AdminDashboardPage.jsx"
      - "frontend/src/components/layout/DashboardLayout.jsx"
      - ".github/workflows/guides-searchable.yml"

jobs:
  backend-guides:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weave_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint guide files
        run: |
          uv run ruff check \
            app/modules/user_guides \
            alembic/versions/20260801_user_guides.py \
            tests/unit/user_guides

      - name: Check guide formatting
        run: |
          uv run ruff format --check \
            app/modules/user_guides \
            alembic/versions/20260801_user_guides.py \
            tests/unit/user_guides

      - name: Import application and assert guide routes
        run: |
          uv run python - <<'PY'
          from app.main import app

          methods_by_path = {
              route.path: set(getattr(route, "methods", set()) or set())
              for route in app.routes
          }
          path = "/api/v1/guides/{guide_key}"
          assert path in methods_by_path, f"Missing guide route: {path}"
          assert {"GET", "PATCH"}.issubset(methods_by_path[path])
          PY

      - name: Upgrade fresh database
        run: uv run alembic upgrade head

      - name: Verify guide table
        run: |
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import inspect
          from app.config.database import engine

          async def main():
              async with engine.begin() as connection:
                  tables = await connection.run_sync(
                      lambda sync_connection: inspect(sync_connection).get_table_names(schema="public")
                  )
                  assert "user_guide_states" in tables
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Run guide regression tests
        run: uv run pytest tests/unit/user_guides -q

  frontend-guides:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
