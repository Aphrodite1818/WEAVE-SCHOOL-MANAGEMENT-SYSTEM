name: Temporary CI diagnostics

on:
  push:
    branches:
      - cbt-sync-module-structure
    paths:
      - ".github/workflows/temporary-ci-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capture frontend lint
        shell: bash
        run: |
          cd frontend
          npm ci
          set +e
          npm run lint > ../frontend-lint-diagnostic.txt 2>&1
          echo "frontend_lint_status=$?" >> ../frontend-lint-diagnostic.txt
          exit 0
      - name: Capture focused backend tests
        shell: bash
        run: |
          cd backend
          uv sync
          set +e
          uv run pytest tests/unit/student_academics/test_bulk_academic_actions.py tests/unit/classes/test_academic_level_architecture.py -q --tb=short > ../backend-test-diagnostic.txt 2>&1
          echo "backend_test_status=$?" >> ../backend-test-diagnostic.txt
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-lint-diagnostic.txt backend-test-diagnostic.txt
          git commit -m "chore: capture CI diagnostics"
          git push origin HEAD:cbt-sync-module-structure
