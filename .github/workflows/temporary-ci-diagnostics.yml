name: Temporary CI diagnostics

on:
  push:
    branches:
      - cbt-sync-module-structure
    paths:
      - ".github/workflows/temporary-ci-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Fix academic class unit-test fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/unit/classes/test_academic_level_architecture.py")
          text = path.read_text()
          old = '''        patch(
            "app.modules.classes.service.ClassRoomRepository.save",
            new=AsyncMock(return_value=classroom),
        ),
    ):
'''
          new = '''        patch(
            "app.modules.classes.service.ClassRoomRepository.get_by_level_arm_label",
            new=AsyncMock(return_value=classroom),
        ),
        patch(
            "app.modules.classes.service.ClassRoomRepository.save",
            new=AsyncMock(return_value=classroom),
        ),
    ):
'''
          if old not in text:
              raise SystemExit("Expected class fixture fragment not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Capture frontend lint and tests
        shell: bash
        run: |
          cd frontend
          npm ci
          set +e
          npm run lint > ../frontend-lint-diagnostic.txt 2>&1
          echo "frontend_lint_status=$?" >> ../frontend-lint-diagnostic.txt
          npm test > ../frontend-test-diagnostic.txt 2>&1
          echo "frontend_test_status=$?" >> ../frontend-test-diagnostic.txt
          exit 0

      - name: Capture focused backend tests
        shell: bash
        run: |
          cd backend
          uv sync
          set +e
          uv run pytest tests/unit/student_academics/test_bulk_academic_actions.py tests/unit/classes/test_academic_level_architecture.py -q --tb=short > ../backend-test-diagnostic.txt 2>&1
          echo "backend_test_status=$?" >> ../backend-test-diagnostic.txt
          exit 0

      - name: Commit fixes and diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/unit/classes/test_academic_level_architecture.py frontend-lint-diagnostic.txt frontend-test-diagnostic.txt backend-test-diagnostic.txt
          git commit -m "test: align academic refactor regression fixtures"
          git push origin HEAD:cbt-sync-module-structure
