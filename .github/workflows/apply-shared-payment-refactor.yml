name: Apply shared payment refactor patch

on:
  push:
    branches:
      - refactor/shared-payment-engine

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-payment-engine
          fetch-depth: 0

      - name: Apply targeted refactor edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Main settings owns AI purchase pricing configuration.
          replace_once(
              "backend/app/config/settings.py",
              '    CBT_AI_IMAGE_SEARCH_PROVIDER: Literal["openverse"] = "openverse"\n\n',
              '    CBT_AI_IMAGE_SEARCH_PROVIDER: Literal["openverse"] = "openverse"\n'
              '    CBT_AI_CREDIT_UNIT_PRICE_KOBO: int = Field(default=0, ge=0)\n'
              '    CBT_AI_MINIMUM_PURCHASE_CREDITS: int = Field(default=1, gt=0)\n\n',
          )

          # AI pricing wrapper reads the canonical application settings object.
          Path("backend/app/modules/cbt/ai/quota/pricing.py").write_text(
              '"""Backend-owned commercial pricing configuration for CBT AI credits."""\n\n'
              'from app.config.settings import settings\n\n'
              'ai_quota_pricing = settings\n'
          )

          # Subscription checkout uses the shared payment engine directly.
          replace_once(
              "backend/app/modules/subscriptions/term_entitlement_service.py",
              'from app.modules.subscriptions.providers.paystack import PaystackClient\n',
              'from app.modules.payments.enums import PaymentPurpose\n'
              'from app.modules.payments.service import PaymentEngine\n',
          )
          replace_once(
              "backend/app/modules/subscriptions/term_entitlement_service.py",
              '''        response = await PaystackClient().initialize_transaction(\n            email=email,\n            amount_kobo=amount_kobo,\n            reference=reference,\n            callback_url=callback_url,\n            metadata={\n                "tenant_id": str(tenant_id),\n                "academic_term_id": str(term_id),\n                "plan_code": target.value,\n                "amount_kobo": amount_kobo,\n                "target_plan_price_kobo": TermPlanEntitlementService.amount_kobo(target),\n                "paid_to_date_kobo": paid_to_date,\n                "transition": transition,\n            },\n        )\n        data = response.get("data") or {}\n        transaction.authorization_url = data.get("authorization_url")\n        transaction.access_code = data.get("access_code")\n        if not transaction.authorization_url or not transaction.access_code:\n            raise ConflictException("Paystack did not return a usable checkout session.")\n''',
              '''        checkout = await PaymentEngine.initialize_checkout(\n            email=email,\n            amount_kobo=amount_kobo,\n            reference=reference,\n            callback_url=callback_url,\n            metadata={\n                "payment_purpose": PaymentPurpose.TERM_SUBSCRIPTION.value,\n                "tenant_id": str(tenant_id),\n                "academic_term_id": str(term_id),\n                "plan_code": target.value,\n                "amount_kobo": amount_kobo,\n                "target_plan_price_kobo": TermPlanEntitlementService.amount_kobo(target),\n                "paid_to_date_kobo": paid_to_date,\n                "transition": transition,\n            },\n        )\n        transaction.authorization_url = checkout.authorization_url\n        transaction.access_code = checkout.access_code\n''',
          )

          # Browser verification also goes through the shared engine.
          replace_once(
              "backend/app/modules/subscriptions/router.py",
              'from app.modules.subscriptions.providers.paystack import PaystackClient\n',
              'from app.modules.payments.enums import PaymentPurpose\n'
              'from app.modules.payments.service import PaymentEngine\n',
          )
          replace_once(
              "backend/app/modules/subscriptions/router.py",
              '''    provider_response = await PaystackClient().verify_transaction(reference=reference)\n    entitlement = await settle_verified_term_payment(\n        db,\n        transaction,\n        provider_response,\n    )\n''',
              '''    verified = await PaymentEngine.verify_transaction(\n        reference=reference,\n        expected_amount_kobo=transaction.amount_kobo,\n        expected_currency=transaction.currency,\n        expected_metadata={\n            "payment_purpose": PaymentPurpose.TERM_SUBSCRIPTION.value,\n            "tenant_id": str(transaction.tenant_id),\n            "academic_term_id": str(transaction.academic_term_id),\n            "plan_code": transaction.plan_code.value,\n        },\n    )\n    entitlement = await settle_verified_term_payment(\n        db,\n        transaction,\n        verified.raw_payload,\n    )\n''',
          )

          # Register the central payment router while preserving the old subscription webhook alias.
          replace_once(
              "backend/app/main.py",
              'from app.modules.parents.router import router as parent_router\n',
              'from app.modules.parents.router import router as parent_router\n'
              'from app.modules.payments.router import router as payments_router\n',
          )
          replace_once(
              "backend/app/main.py",
              '    app.include_router(subscriptions_router, prefix=API_V1_PREFIX)\n',
              '    app.include_router(payments_router, prefix=API_V1_PREFIX)\n'
              '    app.include_router(subscriptions_router, prefix=API_V1_PREFIX)\n',
          )

          # Quota settlement can participate in the webhook transaction without an early commit.
          replace_once(
              "backend/app/modules/cbt/ai/quota/service.py",
              '''    async def credit_verified_purchase(\n        cls,\n        db: AsyncSession,\n        *,\n        tenant_id: uuid.UUID,\n        reference: str,\n    ) -> AIQuotaPurchaseResponse:\n''',
              '''    async def credit_verified_purchase(\n        cls,\n        db: AsyncSession,\n        *,\n        tenant_id: uuid.UUID,\n        reference: str,\n        commit: bool = True,\n    ) -> AIQuotaPurchaseResponse:\n''',
          )
          replace_once(
              "backend/app/modules/cbt/ai/quota/service.py",
              '''            if purchase.status == AIQuotaPurchaseStatus.SUCCESS:\n                response = cls._purchase_response(purchase)\n                await db.commit()\n                return response\n''',
              '''            if purchase.status == AIQuotaPurchaseStatus.SUCCESS:\n                response = cls._purchase_response(purchase)\n                if commit:\n                    await db.commit()\n                return response\n''',
          )
          # Restrict this replacement to the purchase method by replacing the exact tail nearest its ledger entry.
          replace_once(
              "backend/app/modules/cbt/ai/quota/service.py",
              '''            await AICreditLedgerRepository.create(\n                db,\n                AICreditLedger(\n                    tenant_id=tenant_id,\n                    quota_account_id=None,\n                    bucket=AICreditLedgerBucket.TENANT_RESERVE,\n                    event_type=AICreditLedgerEventType.PURCHASE,\n                    credit_delta=purchase.credits,\n                    purchase_id=purchase.id,\n                    description="Tenant AI credit purchase credited.",\n                ),\n            )\n            await db.commit()\n''',
              '''            await AICreditLedgerRepository.create(\n                db,\n                AICreditLedger(\n                    tenant_id=tenant_id,\n                    quota_account_id=None,\n                    bucket=AICreditLedgerBucket.TENANT_RESERVE,\n                    event_type=AICreditLedgerEventType.PURCHASE,\n                    credit_delta=purchase.credits,\n                    purchase_id=purchase.id,\n                    description="Tenant AI credit purchase credited.",\n                ),\n            )\n            if commit:\n                await db.commit()\n''',
          )
          replace_once(
              "backend/app/modules/cbt/ai/quota/payment_service.py",
              '''        await AIQuotaService.credit_verified_purchase(\n            db,\n            tenant_id=purchase.tenant_id,\n            reference=purchase.reference,\n        )\n''',
              '''        await AIQuotaService.credit_verified_purchase(\n            db,\n            tenant_id=purchase.tenant_id,\n            reference=purchase.reference,\n            commit=False,\n        )\n''',
          )
          PY

      - name: Format touched Python files
        run: |
          python -m pip install --quiet ruff
          ruff format \
            backend/app/config/settings.py \
            backend/app/main.py \
            backend/app/modules/subscriptions/term_entitlement_service.py \
            backend/app/modules/subscriptions/router.py \
            backend/app/modules/cbt/ai/quota/service.py \
            backend/app/modules/cbt/ai/quota/payment_service.py \
            backend/app/modules/cbt/ai/quota/pricing.py \
            backend/app/modules/payments/router.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/.env.example
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "integrate shared payment engine across subscription and AI quota"
          git push origin HEAD:refactor/shared-payment-engine
