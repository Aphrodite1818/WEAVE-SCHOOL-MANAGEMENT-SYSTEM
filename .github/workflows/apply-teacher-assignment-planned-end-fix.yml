});
'''
          frontend_test_path.write_text(frontend_test)
          PY

      - name: Remove one-time applicator
        run: rm .github/workflows/apply-teacher-assignment-planned-end-fix.yml

      - name: Commit applied fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/student_academics/service.py \
                  backend/tests/unit/student_academics/test_teacher_assignment_handover_regressions.py \
                  frontend/src/features/academic-admin/TeacherAssignmentsWorkspace.jsx \
                  frontend/test/teacher-assignment-level-first-contract.test.js \
