name: Apply teacher assignment planned-end fix

on:
  push:
    branches:
      - "fix/teacher-assignment-planned-end-handover-20260916"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source and test changes
        run: python tools/apply_teacher_assignment_planned_end_fix.py

      - name: Remove temporary applicator files
        run: |
          rm tools/apply_teacher_assignment_planned_end_fix.py
          rm .github/workflows/apply-teacher-assignment-planned-end-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix planned teacher assignment handovers"
          git push origin HEAD:fix/teacher-assignment-planned-end-handover-20260916
