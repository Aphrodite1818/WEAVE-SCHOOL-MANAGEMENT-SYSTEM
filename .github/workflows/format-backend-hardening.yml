name: Format backend hardening diff

on:
  push:
    branches:
      - feat/resend-production-email
    paths:
      - ".github/workflows/format-backend-hardening.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/resend-production-email
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Format all changed backend Python files
        shell: bash
        run: |
          BASELINE_SHA=af21c4fab812ce883ac7382ea25b31863ea8ec51
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASELINE_SHA"...HEAD -- ../backend \
              | sed 's#^backend/##' \
              | grep -E '\.py$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files to format."
            exit 0
          fi
          printf 'Formatting %s backend Python files.\n' "${#files[@]}"
          uv run ruff format "${files[@]}"

      - name: Commit formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(email): format Resend implementation"
          git push origin HEAD:feat/resend-production-email
