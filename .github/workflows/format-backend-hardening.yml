name: Diagnose Resend unit tests

on:
  push:
    branches:
      - feat/resend-production-email
    paths:
      - ".github/workflows/format-backend-hardening.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/resend-production-email
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Capture unit-test output
        shell: bash
        run: |
          set +e
          uv run pytest tests/unit -q > ../unit-test-output.txt 2>&1
          code=$?
          echo "pytest_exit_code=$code" >> ../unit-test-output.txt
          exit 0

      - name: Upload unit-test output
        uses: actions/upload-artifact@v4
        with:
          name: resend-unit-test-output
          path: unit-test-output.txt
          if-no-files-found: error
