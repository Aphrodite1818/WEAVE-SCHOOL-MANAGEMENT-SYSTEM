name: Apply reviewed release fixes

on:
  push:
    branches: [Attendance]
    paths:
      - .github/workflows/one-time-release-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Attendance
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Restore the enum import removed during the communications rewrite.
          replace_once(
              "backend/app/modules/student_academics/session_closure_service.py",
              "from app.modules.communications.enums import CommunicationActorType, NotificationSourceType",
              "from app.modules.communications.enums import (\n    AnnouncementPriority,\n    CommunicationActorType,\n    NotificationSourceType,\n)",
          )

          # Keep message ordering deterministic for list previews, threads, and unread calculations.
          replace_once(
              "backend/app/modules/communications/models.py",
              '''    messages: Mapped[list["Message"]] = relationship(\n        "Message",\n        back_populates="conversation",\n        cascade="all, delete-orphan",\n    )''',
              '''    messages: Mapped[list["Message"]] = relationship(\n        "Message",\n        back_populates="conversation",\n        cascade="all, delete-orphan",\n        order_by="Message.created_at",\n    )''',
          )

          # Message delivery: valid role-specific navigation and notification read synchronization.
          replace_once(
              "backend/app/modules/communications/messaging_service.py",
              "from sqlalchemy.ext.asyncio import AsyncSession",
              "from sqlalchemy import update\nfrom sqlalchemy.ext.asyncio import AsyncSession",
          )
          replace_once(
              "backend/app/modules/communications/messaging_service.py",
              "from app.modules.communications.enums import CommunicationActorType, ConversationType, NotificationSourceType",
              "from app.modules.communications.enums import (\n    CommunicationActorType,\n    ConversationType,\n    NotificationSourceType,\n    NotificationStatus,\n)",
          )
          replace_once(
              "backend/app/modules/communications/messaging_service.py",
              "from app.modules.communications.models import Conversation, ConversationParticipant, Message",
              "from app.modules.communications.models import (\n    Conversation,\n    ConversationParticipant,\n    Message,\n    NotificationDelivery,\n)",
          )
          replace_once(
              "backend/app/modules/communications/messaging_service.py",
              "\n\nclass MessagingService:",
              '''\n\n_MESSAGE_PATHS = {\n    CommunicationActorType.SUPERADMIN: "/superadmin/messages",\n    CommunicationActorType.TENANT_ADMIN: "/admin/messages",\n    CommunicationActorType.TEACHER: "/teacher/messages",\n    CommunicationActorType.STUDENT: "/student/messages",\n    CommunicationActorType.PARENT: "/parent/messages",\n}\n\n\ndef _message_action_path(actor_type: CommunicationActorType, conversation_id: uuid.UUID) -> str:\n    base_path = _MESSAGE_PATHS[actor_type]\n    return f"{base_path}?conversation={conversation_id}"\n\n\nclass MessagingService:''',
          )
          replace_once(
              "backend/app/modules/communications/messaging_service.py",
              '''            await NotificationService.deliver(\n                db,\n                recipients=recipients,\n                source_type=NotificationSourceType.MESSAGE,\n                source_id=message.id,\n                title="New direct message",\n                preview=body,\n                action_path=f"/messages/conversations/{conversation.id}",\n                tenant_id=conversation.tenant_id,\n            )''',
              '''            for recipient in recipients:\n                await NotificationService.deliver(\n                    db,\n                    recipients=[recipient],\n                    source_type=NotificationSourceType.MESSAGE,\n                    source_id=message.id,\n                    title="New direct message",\n                    preview=body,\n                    action_path=_message_action_path(recipient.actor_type, conversation.id),\n                    tenant_id=conversation.tenant_id,\n                )''',
          )
          replace_once(
              "backend/app/modules/communications/messaging_service.py",
              '''        if latest is not None:\n            for participant in conversation.participants:\n                if participant.actor_type == actor_type_for(actor) and participant.actor_id == actor.id:\n                    participant.last_read_message_id = latest.id\n        await db.flush()\n        return conversation''',
              '''        current_actor_type = actor_type_for(actor)\n        if latest is not None:\n            for participant in conversation.participants:\n                if participant.actor_type == current_actor_type and participant.actor_id == actor.id:\n                    participant.last_read_message_id = latest.id\n            message_ids = [message.id for message in conversation.messages if message.deleted_at is None]\n            if message_ids:\n                await db.execute(\n                    update(NotificationDelivery)\n                    .where(\n                        NotificationDelivery.recipient_actor_type == current_actor_type,\n                        NotificationDelivery.recipient_actor_id == actor.id,\n                        NotificationDelivery.source_type == NotificationSourceType.MESSAGE,\n                        NotificationDelivery.source_id.in_(message_ids),\n                        NotificationDelivery.status == NotificationStatus.UNREAD,\n                    )\n                    .values(status=NotificationStatus.READ, read_at=datetime.now(timezone.utc))\n                )\n        await db.flush()\n        return conversation''',
          )

          # Announcement notification links must land on an existing inbox for each actor.
          replace_once(
              "backend/app/modules/communications/announcement_service.py",
              "\n\nclass AnnouncementService:",
              '''\n\n_ANNOUNCEMENT_INBOX_PATHS = {\n    CommunicationActorType.TENANT_ADMIN: "/admin/inbox",\n    CommunicationActorType.TEACHER: "/teacher/inbox",\n    CommunicationActorType.STUDENT: "/student/inbox",\n    CommunicationActorType.PARENT: "/parent/inbox",\n}\n\n\ndef _announcement_action_path(actor_type: CommunicationActorType, announcement_id: uuid.UUID) -> str:\n    return f"{_ANNOUNCEMENT_INBOX_PATHS[actor_type]}?announcement={announcement_id}"\n\n\nclass AnnouncementService:''',
          )
          replace_once(
              "backend/app/modules/communications/announcement_service.py",
              '''        await NotificationService.deliver(\n            db,\n            recipients=recipients,\n            source_type=NotificationSourceType.ANNOUNCEMENT,\n            source_id=announcement.id,\n            title=announcement.title,\n            preview=announcement.body,\n            action_path=f"/announcements/{announcement.id}",\n            tenant_id=announcement.tenant_id,\n        )''',
              '''        for recipient in recipients:\n            await NotificationService.deliver(\n                db,\n                recipients=[recipient],\n                source_type=NotificationSourceType.ANNOUNCEMENT,\n                source_id=announcement.id,\n                title=announcement.title,\n                preview=announcement.body,\n                action_path=_announcement_action_path(recipient.actor_type, announcement.id),\n                tenant_id=announcement.tenant_id,\n            )''',
          )

          # Compute per-conversation and aggregate unread counts instead of returning constant zero.
          replace_once(
              "backend/app/modules/communications/router.py",
              '''async def _conversation_response(db: DbSession, conversation) -> ConversationResponse:\n    labels = await _participant_labels(db, conversation.participants)\n    response = ConversationResponse.model_validate(conversation)\n    response.participants = [\n        ConversationParticipantResponse.model_validate(participant).model_copy(\n            update={\n                "label": labels.get((\n                    participant.actor_type if isinstance(participant.actor_type, CommunicationActorType) else CommunicationActorType(participant.actor_type),\n                    participant.actor_id,\n                )),\n                "group_label": str(\n                    participant.actor_type.value if hasattr(participant.actor_type, "value") else participant.actor_type\n                ).replace("_", " "),\n            },\n        )\n        for participant in conversation.participants\n    ]\n    return response''',
              '''async def _conversation_response(db: DbSession, conversation, current_actor=None) -> ConversationResponse:\n    labels = await _participant_labels(db, conversation.participants)\n    response = ConversationResponse.model_validate(conversation)\n    response.participants = [\n        ConversationParticipantResponse.model_validate(participant).model_copy(\n            update={\n                "label": labels.get((\n                    participant.actor_type if isinstance(participant.actor_type, CommunicationActorType) else CommunicationActorType(participant.actor_type),\n                    participant.actor_id,\n                )),\n                "group_label": str(\n                    participant.actor_type.value if hasattr(participant.actor_type, "value") else participant.actor_type\n                ).replace("_", " "),\n            },\n        )\n        for participant in conversation.participants\n    ]\n    if current_actor is not None:\n        current_type = actor_type_for(current_actor)\n        current_participant = next(\n            (\n                participant\n                for participant in conversation.participants\n                if participant.actor_type == current_type\n                and participant.actor_id == current_actor.id\n                and participant.left_at is None\n            ),\n            None,\n        )\n        visible_messages = [message for message in conversation.messages if message.deleted_at is None]\n        start_index = 0\n        if current_participant is not None and current_participant.last_read_message_id is not None:\n            for index, message in enumerate(visible_messages):\n                if message.id == current_participant.last_read_message_id:\n                    start_index = index + 1\n                    break\n        response.unread_count = sum(\n            1\n            for message in visible_messages[start_index:]\n            if not (message.sender_actor_type == current_type and message.sender_actor_id == current_actor.id)\n        )\n    return response''',
          )
          replace_once(
              "backend/app/modules/communications/router.py",
              '''    unread_count = 0\n    return ConversationListResponse(items=[await _conversation_response(db, item) for item in items], total=total, unread_count=unread_count)''',
              '''    responses = [await _conversation_response(db, item, current) for item in items]\n    return ConversationListResponse(\n        items=responses,\n        total=total,\n        unread_count=sum(item.unread_count for item in responses),\n    )''',
          )
          replace_once(
              "backend/app/modules/communications/router.py",
              "return await _conversation_response(db, conversation)\n\n\n@messages_router.get",
              "return await _conversation_response(db, conversation, current)\n\n\n@messages_router.get",
          )
          replace_once(
              "backend/app/modules/communications/router.py",
              "return await _conversation_response(db, conversation)\n\n\n@messages_router.post(\"/conversations/{conversation_id}/messages\"",
              "return await _conversation_response(db, conversation, current)\n\n\n@messages_router.post(\"/conversations/{conversation_id}/messages\"",
          )
          replace_once(
              "backend/app/modules/communications/router.py",
              "return await _conversation_response(db, conversation)\n\n\n@notifications_router.get",
              "return await _conversation_response(db, conversation, current)\n\n\n@notifications_router.get",
          )

          # Shared actors can only read active calendar days, even when supplying a calendar id.
          replace_once(
              "backend/app/modules/school_calendar/shared_router.py",
              "active_only=calendar_id is None,",
              "active_only=True,",
          )
          replace_once(
              "backend/app/modules/school_calendar/service.py",
              '''        days = await SchoolCalendarRepository.list_days_by_range(\n            db,\n            tenant_id,\n            start_date=start_date,\n            end_date=end_date,\n        )\n        notable_days = [''',
              '''        days = await SchoolCalendarRepository.list_days_by_range(\n            db,\n            tenant_id,\n            start_date=start_date,\n            end_date=end_date,\n            active_only=True,\n        )\n        notable_days = [''',
          )

          # Subscription cancellation request contract.
          replace_once(
              "backend/app/modules/subscriptions/schemas.py",
              "import uuid\nfrom datetime import datetime\nfrom decimal import Decimal",
              "import uuid\nfrom datetime import datetime\nfrom decimal import Decimal\nfrom typing import Literal",
          )
          replace_once(
              "backend/app/modules/subscriptions/schemas.py",
              "from pydantic import BaseModel, ConfigDict, EmailStr, field_validator",
              "from pydantic import BaseModel, ConfigDict, EmailStr, Field, field_validator",
          )
          replace_once(
              "backend/app/modules/subscriptions/schemas.py",
              "\n\nclass SubscriptionCheckoutCreate(BaseModel):",
              '''\n\nclass SubscriptionCancellationRequest(BaseModel):\n    model_config = ConfigDict(extra="forbid", str_strip_whitespace=True)\n\n    confirmation: Literal["CANCEL_SUBSCRIPTION"]\n    reason: str | None = Field(default=None, min_length=3, max_length=500)\n\n\nclass SubscriptionCheckoutCreate(BaseModel):''',
          )

          replace_once(
              "backend/app/modules/subscriptions/providers/paystack.py",
              "\n    def verify_webhook_signature(\n",
              '''\n    async def disable_subscription(\n        self,\n        *,\n        code: str,\n        token: str,\n    ) -> dict[str, Any]:\n        payload = {"code": code, "token": token}\n        timeout = httpx.Timeout(20.0, connect=5.0)\n        async with httpx.AsyncClient(timeout=timeout) as client:\n            response = await client.post(\n                f"{self.base_url}/subscription/disable",\n                headers=self._headers(),\n                json=payload,\n            )\n\n        if response.status_code >= 400:\n            raise PaystackProviderError(f"Paystack subscription disable failed: {response.text}")\n\n        parsed = response.json()\n        if not parsed.get("status"):\n            raise PaystackProviderError(\n                str(parsed.get("message") or "Paystack subscription disable failed")\n            )\n        return parsed\n\n    def verify_webhook_signature(\n''',
          )

          replace_once(
              "backend/app/modules/subscriptions/service.py",
              "    @staticmethod\n    async def sync_expired_subscriptions(\n",
              '''    @staticmethod\n    async def request_cancellation(\n        db: AsyncSession,\n        *,\n        tenant_id: uuid.UUID,\n        notes: str | None = None,\n    ) -> TenantSubscription:\n        subscription = await SubscriptionRepository.get_current_subscription(\n            db=db,\n            tenant_id=tenant_id,\n            for_update=True,\n        )\n        if subscription is None:\n            raise NotFoundException("No current subscription was found.")\n        if subscription.status == SubscriptionStatus.NON_RENEWING or subscription.cancel_at_period_end:\n            return subscription\n        if subscription.status != SubscriptionStatus.ACTIVE:\n            raise BadRequestException("Only an active paid subscription can be cancelled.")\n\n        if subscription.provider == PaymentProvider.PAYSTACK:\n            if not subscription.provider_subscription_code or not subscription.provider_email_token:\n                raise BadRequestException(\n                    "This Paystack subscription is missing the provider cancellation credentials. Contact support."\n                )\n            try:\n                await PaystackClient().disable_subscription(\n                    code=subscription.provider_subscription_code,\n                    token=subscription.provider_email_token,\n                )\n            except PaystackProviderError as exc:\n                raise HTTPException(\n                    status_code=status.HTTP_502_BAD_GATEWAY,\n                    detail="Unable to cancel subscription renewal with Paystack.",\n                ) from exc\n        elif subscription.provider != PaymentProvider.MANUAL:\n            raise BadRequestException("This subscription provider does not support self-service cancellation.")\n\n        return await SubscriptionLifecycleService.mark_non_renewing(\n            db=db,\n            subscription=subscription,\n            notes=notes or "Tenant administrator disabled automatic renewal.",\n        )\n\n    @staticmethod\n    async def sync_expired_subscriptions(\n''',
          )
          replace_once(
              "backend/app/modules/subscriptions/service.py",
              '''        await SubscriptionLifecycleService.cancel_subscription(\n            db=db,\n            subscription=subscription,\n            notes="Paystack disabled subscription.",\n        )''',
              '''        await SubscriptionLifecycleService.mark_non_renewing(\n            db=db,\n            subscription=subscription,\n            notes="Paystack disabled automatic renewal.",\n        )''',
          )

          replace_once(
              "backend/app/modules/subscriptions/router.py",
              "    SubscriptionCheckoutCreate,\n    SubscriptionCheckoutResponse,",
              "    SubscriptionCancellationRequest,\n    SubscriptionCheckoutCreate,\n    SubscriptionCheckoutResponse,",
          )
          replace_once(
              "backend/app/modules/subscriptions/router.py",
              "\n\n@router.post(\n    \"/checkout\",",
              '''\n\n@router.post("/cancel", response_model=TenantSubscriptionResponse)\nasync def cancel_current_subscription(\n    payload: SubscriptionCancellationRequest,\n    db: DbSession,\n    current_admin: CurrentTenantAdmin,\n) -> TenantSubscriptionResponse:\n    _ = payload.confirmation\n    subscription = await SubscriptionLifecycleService.request_cancellation(\n        db=db,\n        tenant_id=current_admin.tenant_id,\n        notes=payload.reason,\n    )\n    return TenantSubscriptionResponse.model_validate(subscription)\n\n\n@router.post(\n    "/checkout",''',
          )

          # Parent/student report-card APIs expose session and term filters.
          replace_once(
              "backend/app/modules/report_cards/router.py",
              '''async def list_child_report_cards(\n    student_id: UUID,\n    db: DbSession,\n    current_parent: CurrentParent,\n    response: Response,\n) -> ReportCardListResponse:''',
              '''async def list_child_report_cards(\n    student_id: UUID,\n    db: DbSession,\n    current_parent: CurrentParent,\n    response: Response,\n    academic_session_id: UUID | None = Query(default=None),\n    academic_term_id: UUID | None = Query(default=None),\n) -> ReportCardListResponse:''',
          )
          replace_once(
              "backend/app/modules/report_cards/router.py",
              '''        current_parent,\n        student_id=student_id,\n    )''',
              '''        current_parent,\n        student_id=student_id,\n        academic_session_id=academic_session_id,\n        academic_term_id=academic_term_id,\n    )''',
          )
          replace_once(
              "backend/app/modules/report_cards/router.py",
              '''async def list_my_report_cards(\n    db: DbSession,\n    current_student: CurrentStudent,\n    response: Response,\n) -> ReportCardListResponse:''',
              '''async def list_my_report_cards(\n    db: DbSession,\n    current_student: CurrentStudent,\n    response: Response,\n    academic_session_id: UUID | None = Query(default=None),\n    academic_term_id: UUID | None = Query(default=None),\n) -> ReportCardListResponse:''',
          )
          replace_once(
              "backend/app/modules/report_cards/router.py",
              "    items, total = await ReportCardService.list_cards(db, current_student)\n",
              '''    items, total = await ReportCardService.list_cards(\n        db,\n        current_student,\n        academic_session_id=academic_session_id,\n        academic_term_id=academic_term_id,\n    )\n''',
          )

          # Remove this one-time workflow from the resulting branch state.
          Path(".github/workflows/one-time-release-fixes.yml").unlink()
          PY

      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: harden communications calendar and subscription lifecycle"
          git push origin HEAD:Attendance
