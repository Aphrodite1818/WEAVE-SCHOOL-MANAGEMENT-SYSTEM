name: Academic bulk actions

on:
  pull_request:
    paths:
      - "backend/app/main.py"
      - "backend/app/modules/classes/**"
      - "backend/app/modules/report_cards/bulk_*.py"
      - "backend/app/modules/student_academics/bulk_results_router.py"
      - "backend/app/modules/student_academics/progression_service.py"
      - "backend/tests/unit/student_academics/test_bulk_academic_actions.py"
      - "backend/tests/unit/classes/test_academic_level_architecture.py"
      - ".github/workflows/academic-bulk.yml"
  push:
    branches:
      - Attendance
      - staging
      - master
    paths:
      - "backend/app/main.py"
      - "backend/app/modules/classes/**"
      - "backend/app/modules/report_cards/bulk_*.py"
      - "backend/app/modules/student_academics/bulk_results_router.py"
      - "backend/app/modules/student_academics/progression_service.py"
      - "backend/tests/unit/student_academics/test_bulk_academic_actions.py"
      - "backend/tests/unit/classes/test_academic_level_architecture.py"
      - ".github/workflows/academic-bulk.yml"

jobs:
  validate-academic-bulk-actions:
    runs-on: ubuntu-latest

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint changed backend paths
        run: |
          uv run ruff check \
            app/main.py \
            app/modules/classes \
            app/modules/report_cards/bulk_router.py \
            app/modules/report_cards/bulk_schemas.py \
            app/modules/report_cards/bulk_service.py \
            app/modules/student_academics/bulk_results_router.py \
            app/modules/student_academics/progression_service.py \
            tests/unit/student_academics/test_bulk_academic_actions.py \
            tests/unit/classes/test_academic_level_architecture.py

      - name: Check formatting of changed backend paths
        run: |
          uv run ruff format --check \
            app/main.py \
            app/modules/classes \
            app/modules/report_cards/bulk_router.py \
            app/modules/report_cards/bulk_schemas.py \
            app/modules/report_cards/bulk_service.py \
            app/modules/student_academics/bulk_results_router.py \
            app/modules/student_academics/progression_service.py \
            tests/unit/student_academics/test_bulk_academic_actions.py \
            tests/unit/classes/test_academic_level_architecture.py

      - name: Import application and routes
        run: |
          uv run python - <<'PY'
          from app.main import app

          paths = {route.path for route in app.routes}
          expected = {
              "/api/v1/tenant-admin/academics/results/bulk/transition",
              "/api/v1/tenant-admin/academics/results/bulk/reopen",
              "/api/v1/tenant-admin/academic/report-cards/bulk/publish",
              "/api/v1/tenant-admin/academic/report-cards/bulk/archive",
              "/api/v1/tenant-admin/academic/report-cards/bulk/reopen",
              "/api/v1/academic-levels",
              "/api/v1/academic-levels/{academic_level_id}/subjects",
          }
          missing = expected - paths
          assert not missing, f"Missing routes: {sorted(missing)}"
          PY

      - name: Run focused regression tests
        run: |
          uv run pytest \
            tests/unit/student_academics/test_bulk_academic_actions.py \
            tests/unit/classes/test_academic_level_architecture.py \
            -q
