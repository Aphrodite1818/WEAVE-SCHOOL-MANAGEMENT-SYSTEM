name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app/modules/bulk_imports/**"
      - "backend/alembic/versions/20260801_import_idempotency.py"
      - "backend/tests/unit/bulk_imports/**"
      - ".github/scripts/apply_frontend_guide_and_import_cleanup.py"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - Attendance
      - staging
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  prepare-cleanup-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply cleanup patch
        run: python .github/scripts/apply_frontend_guide_and_import_cleanup.py

      - name: Upload transformed files
        uses: actions/upload-artifact@v4
        with:
          name: frontend-guide-import-cleanup
          retention-days: 1
          if-no-files-found: error
          path: |
            frontend
            backend/app/modules/bulk_imports
            backend/alembic/versions/20260801_import_idempotency.py
            backend/tests/unit/bulk_imports/test_import_idempotency.py

  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
