name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/app/modules/bulk_imports/**"
      - "backend/alembic/versions/20260801_import_idempotency.py"
      - "backend/tests/unit/bulk_imports/**"
      - ".github/scripts/apply_frontend_guide_and_import_cleanup.py"
      - ".github/scripts/fix_cleanup_patch_anchor.py"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - Attendance
      - staging
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write

jobs:
  commit-cleanup:
    if: github.event_name == 'pull_request' && github.head_ref == 'Attendance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Attendance branch
        uses: actions/checkout@v4
        with:
          ref: Attendance
          fetch-depth: 0

      - name: Repair patch anchors
        run: python .github/scripts/fix_cleanup_patch_anchor.py

      - name: Apply validated cleanup
        run: python .github/scripts/apply_frontend_guide_and_import_cleanup.py

      - name: Remove temporary patch machinery and restore CI
        shell: bash
        run: |
          rm -f .github/scripts/apply_frontend_guide_and_import_cleanup.py
          rm -f .github/scripts/fix_cleanup_patch_anchor.py
          rm -f .github/workflows/apply-frontend-guide-import-cleanup.yml

          cat > .github/workflows/frontend.yml <<'EOF'
          name: Frontend

          on:
            pull_request:
              paths:
                - "frontend/**"
                - ".github/workflows/frontend.yml"
            push:
              branches:
                - Attendance
                - staging
                - master
              paths:
                - "frontend/**"
                - ".github/workflows/frontend.yml"

          jobs:
            validate:
              runs-on: ubuntu-latest

              defaults:
                run:
                  working-directory: frontend

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Install dependencies
                  run: npm ci

                - name: Lint
                  run: npm run lint

                - name: Test
                  run: npm test

                - name: Build
                  run: npm run build
          EOF

          cat > .github/workflows/format-backend-hardening.yml <<'EOF'
          name: Format backend hardening diff

          on:
            push:
              branches:
                - Attendance
              paths:
                - ".github/workflows/format-backend-hardening.yml"

          permissions:
            contents: write

          jobs:
            format:
              runs-on: ubuntu-latest
              defaults:
                run:
                  working-directory: backend
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                  with:
                    ref: Attendance
                    fetch-depth: 0

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Install uv
                  uses: astral-sh/setup-uv@v5

                - name: Install dependencies
                  run: uv sync

                - name: Format all changed backend Python files
                  shell: bash
                  run: |
                    BASELINE_SHA=6a434994d2b2397d45c6716d89c6f1a3eda8ea0f
                    mapfile -t files < <(
                      git diff --name-only --diff-filter=ACMR "$BASELINE_SHA"...HEAD -- ../backend \
                        | sed 's#^backend/##' \
                        | grep -E '\.py$' || true
                    )
                    if [ "${#files[@]}" -eq 0 ]; then
                      echo "No changed Python files to format."
                      exit 0
                    fi
                    printf 'Formatting %s backend Python files.\n' "${#files[@]}"
                    uv run ruff format "${files[@]}"

                - name: Commit formatting
                  working-directory: .
                  run: |
                    if git diff --quiet; then
                      echo "No formatting changes required."
                      exit 0
                    fi
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add backend
                    git commit -m "style: format backend hardening changes"
                    git push origin HEAD:Attendance
          EOF

      - name: Commit directly to Attendance
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine guides and prevent duplicate imports"
          git push origin HEAD:Attendance

  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
