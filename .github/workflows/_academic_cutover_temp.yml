name: Academic cutover temporary

on:
  pull_request:
    branches: [staging]
  push:
    branches: [cbt-sync-module-structure]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0
      - name: Apply teacher assignment cutover
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path("backend/app/modules/student_academics/service.py")
          text = service_path.read_text()

          import_anchor = "from app.modules.student_academics.curriculum_service import CurriculumResolutionService\n"
          bulk_import = (
              "from app.modules.student_academics.curriculum_v2_schemas import (\n"
              "    TeacherAssignmentBulkCreate,\n"
              "    TeacherAssignmentBulkResponse,\n"
              ")\n"
          )
          if "TeacherAssignmentBulkCreate" not in text:
              if import_anchor not in text:
                  raise SystemExit("service import anchor not found")
              text = text.replace(import_anchor, import_anchor + bulk_import, 1)

          start = text.index("    async def create_teacher_assignment(")
          end = text.index("    @staticmethod\n    async def teacher_assignment_dependency_preview(", start)
          section = text[start:end]

          old_signature = (
              "        payload: TeacherAssignmentCreate,\n"
              "        acting_admin_id: uuid.UUID | None = None,\n"
              "    ) -> TeacherAssignmentResponse:\n"
          )
          new_signature = (
              "        payload: TeacherAssignmentCreate,\n"
              "        acting_admin_id: uuid.UUID | None = None,\n"
              "        *,\n"
              "        commit: bool = True,\n"
              "    ) -> TeacherAssignmentResponse:\n"
          )
          if "commit: bool = True" not in section:
              if old_signature not in section:
                  raise SystemExit("teacher create signature anchor not found")
              section = section.replace(old_signature, new_signature, 1)

          old_default = "        effective_from = payload.effective_from or date.today()\n"
          new_default = (
              "        today = date.today()\n"
              "        effective_from = payload.effective_from or (\n"
              "            term.start_date\n"
              "            if term.start_date is not None and term.start_date > today\n"
              "            else today\n"
              "        )\n"
              "        if term.start_date is not None and effective_from < term.start_date:\n"
              "            raise ConflictException(\n"
              "                \"Teacher assignment cannot start before the selected term begins.\"\n"
              "            )\n"
          )
          if old_default in section:
              section = section.replace(old_default, new_default, 1)

          old_tail = (
              "        await db.commit()\n"
              "        return await StudentAcademicService._build_teacher_assignment_response(db, assignment)\n\n"
          )
          new_tail = (
              "        await db.flush()\n"
              "        if commit:\n"
              "            await db.commit()\n"
              "        return await StudentAcademicService._build_teacher_assignment_response(db, assignment)\n\n"
          )
          if "        if commit:\n            await db.commit()" not in section:
              if old_tail not in section:
                  raise SystemExit("teacher create commit anchor not found")
              section = section.replace(old_tail, new_tail, 1)

          if "async def create_teacher_assignments_bulk(" not in section:
              section += '''    @staticmethod
    async def create_teacher_assignments_bulk(
        db: AsyncSession,
        tenant_id: uuid.UUID,
        payload: TeacherAssignmentBulkCreate,
        acting_admin_id: uuid.UUID | None = None,
    ) -> TeacherAssignmentBulkResponse:
        """Create explicit class-subject assignments atomically for one eligible curriculum subject."""

        assignment_ids: list[uuid.UUID] = []
        try:
            for class_id in payload.class_ids:
                response = await StudentAcademicService.create_teacher_assignment(
                    db,
                    tenant_id,
                    TeacherAssignmentCreate(
                        teacher_membership_id=payload.teacher_membership_id,
                        class_id=class_id,
                        curriculum_subject_id=payload.curriculum_subject_id,
                        academic_term_id=payload.academic_term_id,
                        effective_from=payload.effective_from,
                    ),
                    acting_admin_id=acting_admin_id,
                    commit=False,
                )
                assignment_ids.append(response.id)
            await db.commit()
        except Exception:
            await db.rollback()
            raise
        return TeacherAssignmentBulkResponse(
            created=len(assignment_ids),
            assignment_ids=assignment_ids,
        )

'''

          text = text[:start] + section + text[end:]

          reassign_start = text.index("    async def reassign_teacher_assignment(")
          reassign_end = text.index("    @staticmethod\n    async def delete_teacher_assignment(", reassign_start)
          reassign = text[reassign_start:reassign_end]
          if old_default in reassign:
              reassign = reassign.replace(old_default, new_default, 1)
              text = text[:reassign_start] + reassign + text[reassign_end:]

          service_path.write_text(text)

          curriculum_path = Path("backend/app/modules/student_academics/curriculum_v2_service.py")
          curriculum = curriculum_path.read_text()
          old_query = '''        query = select(TeacherAssignment).where(
            TeacherAssignment.tenant_id == tenant_id,
            TeacherAssignment.effective_to.is_(None),
        )
        if class_ids:
'''
          new_query = '''        query = select(TeacherAssignment).where(
            TeacherAssignment.tenant_id == tenant_id,
            TeacherAssignment.effective_to.is_(None),
        )
        # Reconcile only assignments whose effective window can intersect this term.
        # A Third-Term scheduled assignment must not be cancelled while preparing Second Term.
        if term.end_date is not None:
            query = query.where(TeacherAssignment.effective_from <= term.end_date)
        if class_ids:
'''
          if old_query in curriculum:
              curriculum = curriculum.replace(old_query, new_query, 1)
          elif "A Third-Term scheduled assignment must not be cancelled" not in curriculum:
              raise SystemExit("reconciler query anchor not found")
          curriculum_path.write_text(curriculum)

          router_path = Path("backend/app/modules/student_academics/curriculum_router.py")
          router = router_path.read_text()
          schema_anchor = "    ResolvedClassSubjectResponse,\n"
          if "TeacherAssignmentBulkCreate" not in router:
              if schema_anchor not in router:
                  raise SystemExit("curriculum router schema import anchor not found")
              router = router.replace(
                  schema_anchor,
                  schema_anchor + "    TeacherAssignmentBulkCreate,\n    TeacherAssignmentBulkResponse,\n",
                  1,
              )
          service_import_anchor = (
              "from app.modules.student_academics.curriculum_v2_service import AcademicCurriculumService\n"
          )
          if "from app.modules.student_academics.service import StudentAcademicService" not in router:
              router = router.replace(
                  service_import_anchor,
                  service_import_anchor
                  + "from app.modules.student_academics.service import StudentAcademicService\n",
                  1,
              )

          if '"/teacher-assignments/bulk"' not in router:
              endpoint_anchor = '''@router.get(
    "/classes/{class_id}/terms/{academic_term_id}/subjects",
    response_model=list[ResolvedClassSubjectResponse],
)
'''
              endpoint = '''@router.post(
    "/teacher-assignments/bulk",
    response_model=TeacherAssignmentBulkResponse,
    status_code=status.HTTP_201_CREATED,
)
async def create_teacher_assignments_bulk(
    payload: TeacherAssignmentBulkCreate,
    db: DbSession,
    current_admin: CurrentTenantAdmin,
):
    return await StudentAcademicService.create_teacher_assignments_bulk(
        db,
        current_admin.tenant_id,
        payload,
        acting_admin_id=current_admin.id,
    )


'''
              if endpoint_anchor not in router:
                  raise SystemExit("curriculum router endpoint anchor not found")
              router = router.replace(endpoint_anchor, endpoint + endpoint_anchor, 1)
          router_path.write_text(router)
          PY
      - name: Validate cutover contracts
        run: |
          python -m compileall backend/app/modules/student_academics
          python - <<'PY'
          from pathlib import Path

          service = Path("backend/app/modules/student_academics/service.py").read_text()
          curriculum = Path("backend/app/modules/student_academics/curriculum_v2_service.py").read_text()
          router = Path("backend/app/modules/student_academics/curriculum_router.py").read_text()

          assert "async def create_teacher_assignments_bulk(" in service
          assert "commit: bool = True" in service
          assert "Teacher assignment cannot start before the selected term begins." in service
          assert "TeacherAssignment.effective_from <= term.end_date" in curriculum
          assert '"/teacher-assignments/bulk"' in router
          assert "resolve_curriculum_offerings" not in service
          assert "resolve_student_offerings" not in service
          PY
      - name: Commit final cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/student_academics/service.py backend/app/modules/student_academics/curriculum_v2_service.py backend/app/modules/student_academics/curriculum_router.py
          if git diff --cached --quiet; then
            echo "No backend patch to commit"
            exit 0
          fi
          git commit -m "feat: complete teacher assignment term cutover"
          git push origin HEAD:cbt-sync-module-structure