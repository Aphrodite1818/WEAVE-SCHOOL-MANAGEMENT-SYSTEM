name: Academic cutover temporary

on:
  push:
    branches: [cbt-sync-module-structure]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0
      - name: Apply backend cutover
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/app/modules/student_academics/service.py")
          text = path.read_text()

          if "resolve_curriculum_offerings" in text:
              pattern = re.compile(
                  r"        class_department = \(\n.*?"
                  r"        offerings = await CurriculumResolutionService\.resolve_curriculum_offerings\(\n.*?"
                  r"        return term\n",
                  re.S,
              )
              replacement = '''        resolved_subjects = await CurriculumResolutionService.resolve_class_subjects(
              db,
              tenant_id=tenant_id,
              class_id=classroom.id,
              academic_term_id=term.id,
          )
          if curriculum_subject.id not in {
              item.curriculum_subject_id for item in resolved_subjects
          }:
              raise ConflictException(
                  "This curriculum subject is not available to the class for the selected term."
              )
          return term
          '''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("could not replace teacher-assignment offering block")

          if "resolve_student_offerings" in text:
              pattern = re.compile(
                  r"        offerings = await CurriculumResolutionService\.resolve_student_offerings\(\n.*?"
                  r"            raise ForbiddenException\(\n"
                  r"                \"This subject is not offered to the student's class specialization for this term\.\"\n"
                  r"            \)\n",
                  re.S,
              )
              replacement = '''        resolved_subjects = await CurriculumResolutionService.resolve_student_subjects(
              db,
              tenant_id=tenant_id,
              student_id=student.id,
              academic_term_id=term.id,
          )
          if curriculum_subject.id not in {
              item.curriculum_subject_id for item in resolved_subjects
          }:
              raise ForbiddenException(
                  "This subject is not available to the student's class specialization for this term."
              )
          '''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit("could not replace student offering block")

          dep_start = text.index("    async def academic_term_dependency_preview(")
          dep_end = text.index("    @staticmethod\n    async def create_academic_session(", dep_start)
          dep = text[dep_start:dep_end]
          if "specialization_readiness(" not in dep:
              anchor = "        blockers: list[str] = []\n"
              insertion = '''        blockers: list[str] = []
          if term.status == AcademicTermStatus.DRAFT:
              from app.modules.student_academics.curriculum_v2_service import AcademicCurriculumService

              specialization_counts, specialization_blockers = (
                  await AcademicCurriculumService.specialization_readiness(
                      db,
                      tenant_id=tenant_id,
                      term=term,
                  )
              )
              counts.update(specialization_counts)
              blockers.extend(specialization_blockers)
          '''
              if anchor not in dep:
                  raise SystemExit("term dependency blocker anchor not found")
              dep = dep.replace(anchor, insertion, 1)
          dep = dep.replace(
              "            can_open=term.status == AcademicTermStatus.DRAFT,\n",
              "            can_open=term.status == AcademicTermStatus.DRAFT and not blockers,\n",
              1,
          )
          text = text[:dep_start] + dep + text[dep_end:]

          open_start = text.index("    async def open_academic_term(")
          open_end = text.index("    @staticmethod\n    async def start_academic_term_closure(", open_start)
          section = text[open_start:open_end]
          if "reconcile_teacher_assignments_for_term(" not in section:
              anchor = '''        previous = term.status
          term.status = AcademicTermStatus.OPEN
          '''
              insertion = '''        from app.modules.student_academics.curriculum_v2_service import AcademicCurriculumService

          specialization_counts, specialization_blockers = (
              await AcademicCurriculumService.specialization_readiness(
                  db,
                  tenant_id=tenant_id,
                  term=term,
              )
          )
          if specialization_blockers:
              raise ConflictException(
                  "Academic term cannot be opened until class specializations are ready.",
                  payload={
                      "blocker_messages": specialization_blockers,
                      "dependency_counts": specialization_counts,
                  },
              )
          await AcademicCurriculumService.reconcile_teacher_assignments_for_term(
              db,
              tenant_id=tenant_id,
              term=term,
              acting_admin_id=admin_id,
          )

          previous = term.status
          term.status = AcademicTermStatus.OPEN
          '''
              if anchor not in section:
                  raise SystemExit("term opening transition anchor not found")
              section = section.replace(anchor, insertion, 1)
          text = text[:open_start] + section + text[open_end:]

          for obsolete in (
              "resolve_curriculum_offerings",
              "resolve_student_offerings",
              "class_department.department_id",
          ):
              if obsolete in text:
                  raise SystemExit(f"obsolete reference remains: {obsolete}")

          path.write_text(text)
          PY
      - name: Compile academic modules
        run: python -m compileall backend/app/modules/student_academics
      - name: Commit backend cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/student_academics/service.py
          if git diff --cached --quiet; then
            echo "No backend patch to commit"
            exit 0
          fi
          git commit -m "fix: complete academic resolver cutover"
          git push origin HEAD:cbt-sync-module-structure
