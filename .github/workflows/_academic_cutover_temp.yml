name: Academic cutover (temporary)

on:
  push:
    branches:
      - cbt-sync-module-structure

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: retry academic cutover'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0

      - name: Apply academic resolver and term-readiness cutover
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('backend/app/modules/student_academics/service.py')
          text = path.read_text()

          old = '''        class_department = (
              await db.execute(
                  select(ClassTermDepartmentAssignment).where(
                      ClassTermDepartmentAssignment.tenant_id == tenant_id,
                      ClassTermDepartmentAssignment.class_id == class_id,
                      ClassTermDepartmentAssignment.academic_term_id == term.id,
                  )
              )
          ).scalar_one_or_none()
          offerings = await CurriculumResolutionService.resolve_curriculum_offerings(
              db,
              tenant_id=tenant_id,
              academic_level_id=classroom.academic_level_id,
              academic_term_id=term.id,
              department_id=(
                  class_department.department_id if class_department is not None else None
              ),
          )
          if curriculum_subject.id not in {offering.curriculum_subject_id for offering in offerings}:
              raise ConflictException(
                  "This curriculum subject is not offered to the class for the selected term."
              )
          return term
          '''
          new = '''        resolved_subjects = await CurriculumResolutionService.resolve_class_subjects(
              db,
              tenant_id=tenant_id,
              class_id=classroom.id,
              academic_term_id=term.id,
          )
          if curriculum_subject.id not in {
              item.curriculum_subject_id for item in resolved_subjects
          }:
              raise ConflictException(
                  "This curriculum subject is not available to the class for the selected term."
              )
          return term
          '''
          if old not in text:
              raise SystemExit('old teacher-assignment offering block not found')
          text = text.replace(old, new, 1)

          old = '''        offerings = await CurriculumResolutionService.resolve_student_offerings(
              db,
              tenant_id=tenant_id,
              student_id=student.id,
              academic_term_id=term.id,
          )
          if curriculum_subject.id not in {offering.curriculum_subject_id for offering in offerings}:
              raise ForbiddenException(
                  "This subject is not offered to the student's class specialization for this term."
              )
          '''
          new = '''        resolved_subjects = await CurriculumResolutionService.resolve_student_subjects(
              db,
              tenant_id=tenant_id,
              student_id=student.id,
              academic_term_id=term.id,
          )
          if curriculum_subject.id not in {
              item.curriculum_subject_id for item in resolved_subjects
          }:
              raise ForbiddenException(
                  "This subject is not available to the student's class specialization for this term."
              )
          '''
          if old not in text:
              raise SystemExit('old student offering block not found')
          text = text.replace(old, new, 1)

          old = '''        blockers: list[str] = []
          if term.status in {AcademicTermStatus.OPEN, AcademicTermStatus.CLOSING}:
          '''
          new = '''        blockers: list[str] = []
          if term.status == AcademicTermStatus.DRAFT:
              from app.modules.student_academics.curriculum_v2_service import AcademicCurriculumService

              specialization_counts, specialization_blockers = (
                  await AcademicCurriculumService.specialization_readiness(
                      db,
                      tenant_id=tenant_id,
                      term=term,
                  )
              )
              counts.update(specialization_counts)
              blockers.extend(specialization_blockers)
          if term.status in {AcademicTermStatus.OPEN, AcademicTermStatus.CLOSING}:
          '''
          if old not in text:
              raise SystemExit('term dependency blocker anchor not found')
          text = text.replace(old, new, 1)

          old = '            can_open=term.status == AcademicTermStatus.DRAFT,\n'
          new = '            can_open=term.status == AcademicTermStatus.DRAFT and not blockers,\n'
          if old not in text:
              raise SystemExit('term can_open anchor not found')
          text = text.replace(old, new, 1)

          old = '''        previous = term.status
          term.status = AcademicTermStatus.OPEN
          '''
          new = '''        from app.modules.student_academics.curriculum_v2_service import AcademicCurriculumService

          specialization_counts, specialization_blockers = (
              await AcademicCurriculumService.specialization_readiness(
                  db,
                  tenant_id=tenant_id,
                  term=term,
              )
          )
          if specialization_blockers:
              raise ConflictException(
                  "Academic term cannot be opened until class specializations are ready.",
                  payload={
                      "blocker_messages": specialization_blockers,
                      "dependency_counts": specialization_counts,
                  },
              )
          await AcademicCurriculumService.reconcile_teacher_assignments_for_term(
              db,
              tenant_id=tenant_id,
              term=term,
              acting_admin_id=admin_id,
          )

          previous = term.status
          term.status = AcademicTermStatus.OPEN
          '''
          if old not in text:
              raise SystemExit('term opening transition anchor not found')
          text = text.replace(old, new, 1)

          forbidden = [
              'resolve_curriculum_offerings',
              'resolve_student_offerings',
              'class_department.department_id',
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f'obsolete academic resolver references remain: {remaining}')

          path.write_text(text)

      - name: Compile academic modules
        run: python -m compileall backend/app/modules/student_academics

      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/student_academics/service.py
          git commit -m "fix: complete academic resolver cutover"
          git push origin HEAD:cbt-sync-module-structure
