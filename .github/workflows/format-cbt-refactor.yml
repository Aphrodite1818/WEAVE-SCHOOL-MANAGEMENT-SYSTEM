name: Format CBT refactor

on:
  push:
    branches:
      - cbt-sync-module-structure

permissions:
  contents: write

concurrency:
  group: format-cbt-refactor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync

      - name: Format refactor surface with pinned Ruff
        run: |
          uv run ruff format \
            app/modules/classes \
            app/modules/student_academics/progression_service.py \
            app/modules/student_academics/curriculum_models.py \
            app/modules/student_academics/curriculum_v2_schemas.py \
            app/modules/bulk_imports/router.py \
            app/modules/bulk_imports/service.py \
            app/modules/bulk_imports/optimized_validation.py \
            app/modules/cbt/sync \
            tests/test_department_mapping_contracts.py \
            scripts/verify_lifecycle_architecture.py

      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Format department mapping refactor"
          git push origin HEAD:cbt-sync-module-structure
