name: Freeze Alembic baseline once

on:
  push:
    branches:
      - production-hardening
    paths:
      - ".github/workflows/freeze-baseline-once.yml"

permissions:
  contents: write

jobs:
  freeze-baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weave_baseline"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_baseline
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_baseline
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      TWILIO_ACCOUNT_SID: ci-test-account
      TWILIO_AUTH_TOKEN: ci-test-token
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout production-hardening
        uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Generate explicit frozen baseline
        shell: bash
        run: |
          set -euo pipefail

          find alembic/versions -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' -delete

          uv run alembic revision \
            --autogenerate \
            --rev-id 20260731_clean_baseline \
            -m "initial production baseline"

          generated_file="$(find alembic/versions -maxdepth 1 -type f -name '20260731_clean_baseline*.py' -print -quit)"
          test -n "$generated_file"

          if [ "$generated_file" != "alembic/versions/20260731_clean_baseline.py" ]; then
            mv "$generated_file" alembic/versions/20260731_clean_baseline.py
          fi

          uv run python - <<'PY'
          from pathlib import Path

          path = Path("alembic/versions/20260731_clean_baseline.py")
          text = path.read_text(encoding="utf-8")

          downgrade_marker = "def downgrade() -> None:"
          if downgrade_marker not in text:
              raise RuntimeError("Generated baseline has no downgrade function")

          prefix = text.split(downgrade_marker, 1)[0].rstrip()
          replacement = '''


def downgrade() -> None:
    """Never erase the complete Weave schema through Alembic."""

    raise RuntimeError(
        "Downgrading below the initial Weave production baseline is not "
        "supported. Restore a backup or recreate the database explicitly."
    )
'''
          text = prefix + replacement
          text = text.replace(
              '"""initial production baseline\n\nRevision ID:',
              '"""Frozen initial production baseline for Weave.\n\nRevision ID:',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          uv run --with ruff ruff format alembic/versions/20260731_clean_baseline.py

          if grep -Eq 'Base\.metadata|create_all\(|import app\.models' alembic/versions/20260731_clean_baseline.py; then
            echo "Generated migration still depends on live application metadata."
            exit 1
          fi

      - name: Validate baseline against fresh PostgreSQL
        run: |
          uv run --with alembic alembic heads
          uv run --with alembic alembic upgrade head
          uv run --with alembic alembic current
          uv run --with alembic alembic check

      - name: Remove unfinished local generator scripts
        run: |
          rm -f \
            generate_explicit_baseline.py \
            tmp_generate_baseline.py \
            tmp_generate_explicit_baseline.py \
            validate_baseline_temp.py

      - name: Commit frozen baseline
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/versions/20260731_clean_baseline.py
          git add -u backend
          git commit -m "fix: freeze initial alembic baseline"
          git push origin HEAD:production-hardening
