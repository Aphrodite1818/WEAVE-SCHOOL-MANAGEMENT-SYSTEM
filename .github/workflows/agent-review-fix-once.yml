name: Agent review fix one-shot

on:
  push:
    branches: [cbt-sync-module-structure]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: contains(github.event.head_commit.message, '[agent-review-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d weave_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # Student enrollment history: avoid async relationship lazy-loading and
          # preserve tenant scope while reading the immutable placement segment.
          path = "backend/app/modules/students/enrollment_service.py"
          replace_once(path, "from sqlalchemy import func, select", "from sqlalchemy import and_, func, select", "sqlalchemy and import")
          replace_once(path, "from app.modules.classes.models import AcademicLevel, ClassRoom", "from app.modules.classes.models import AcademicLevel, ArmLabel, ClassRoom", "ArmLabel import")
          replace_once(
              path,
              "select(StudentEnrollment, ClassRoom, AcademicLevel, AcademicSession)",
              "select(StudentEnrollment, ClassRoom, AcademicLevel, AcademicSession, ArmLabel)",
              "history select",
          )
          replace_once(
              path,
              ".outerjoin(ClassRoom, ClassRoom.id == StudentEnrollment.class_id)",
              ".outerjoin(\n                    ClassRoom,\n                    and_(\n                        ClassRoom.id == StudentEnrollment.class_id,\n                        ClassRoom.tenant_id == tenant_id,\n                    ),\n                )\n                .outerjoin(\n                    ArmLabel,\n                    and_(\n                        ArmLabel.id == ClassRoom.arm_label_id,\n                        ArmLabel.tenant_id == tenant_id,\n                    ),\n                )",
              "history joins",
          )
          replace_once(
              path,
              "for enrollment, classroom, level, session in rows:",
              "for enrollment, classroom, level, session, arm_label in rows:",
              "history row shape",
          )
          replace_once(path, "class_name=classroom.academic_level_name if classroom else None,", "class_name=level.name if classroom else None,", "history class label")
          replace_once(path, "class_arm=classroom.arm if classroom else None,", "class_arm=arm_label.label if arm_label else None,", "history arm label")
          replace_once(
              path,
              "select(ClassTermDepartmentAssignment.department_id)",
              "select(ClassTermDepartmentAssignment.academic_level_department_id)",
              "CTDA identity",
          )

          # Setup/readiness defects found during review.
          replace_once(
              "backend/app/modules/student_academics/setup_readiness.py",
              'count(TeacherAssignment, TeacherAssignment.state == "current").label(',
              'count(TeacherAssignment, TeacherAssignment.is_active.is_(True)).label(',
              "teacher readiness predicate",
          )
          replace_once(
              "backend/app/modules/student_academics/specialization_workspace.py",
              "    AcademicLevel,\n    AcademicLevelDepartment,",
              "    AcademicLevel,\n    AcademicLevelDepartment,\n    AcademicLevelStatus,",
              "specialization status import",
          )
          replace_once(
              "backend/app/modules/student_academics/specialization_workspace.py",
              "                ClassRoom.is_active.is_(True),\n                ClassRoom.archived_at.is_(None),",
              "                ClassRoom.is_active.is_(True),\n                ClassRoom.archived_at.is_(None),\n                AcademicLevel.status == AcademicLevelStatus.ACTIVE,",
              "specialization active level",
          )
          replace_once(
              "backend/app/modules/student_academics/specialization_workspace.py",
              "                AcademicLevelDepartment.tenant_id == tenant_id,\n                Department.tenant_id == tenant_id,",
              "                AcademicLevelDepartment.tenant_id == tenant_id,\n                AcademicLevelDepartment.is_active.is_(True),\n                AcademicLevelDepartment.archived_at.is_(None),\n                Department.tenant_id == tenant_id,\n                Department.is_active.is_(True),\n                Department.archived_at.is_(None),",
              "specialization live assignment",
          )

          # Student directory: use canonical enrollment response fields and do not
          # send unsupported request fields to the class-change endpoint.
          student_page = Path("frontend/src/pages/admin/StudentDirectoryPage.jsx")
          text = student_page.read_text()
          anchor = '''  const classOptions = useMemo(\n    () => classes.map((item) => ({ value: item.id, label: classLabel(item) })),\n    [classes],\n  );\n'''
          addition = anchor + '''  const classChangeOptions = useMemo(() => {\n    const student = historyState?.student;\n    if (!student) return classOptions;\n    return classes\n      .filter(\n        (item) =>\n          item.id !== student.class_id &&\n          (!student.academic_level_id ||\n            item.academic_level_id === student.academic_level_id),\n      )\n      .map((item) => ({ value: item.id, label: classLabel(item) }));\n  }, [classes, classOptions, historyState?.student]);\n'''
          if text.count(anchor) != 1:
              raise SystemExit("class options anchor mismatch")
          text = text.replace(anchor, addition, 1)
          text = text.replace('        outcome: "reclassified",\n', '', 1)
          history_selector = '''              <SelectField\n                label="Target class"\n                value={historyState.form.target_class_id}\n                options={classOptions}\n'''
          if text.count(history_selector) != 1:
              raise SystemExit("history target selector mismatch")
          text = text.replace(history_selector, history_selector.replace("options={classOptions}", "options={classChangeOptions}"), 1)
          outcome_block = '''              <SelectField\n                label="Outcome"\n                value={historyState.form.outcome}\n                required\n                options={[\n                  { value: "reclassified", label: "Reclassified" },\n                  { value: "repeated", label: "Repeated" },\n                ]}\n                onChange={(event) =>\n                  setHistoryState((current) => ({\n                    ...current,\n                    form: { ...current.form, outcome: event.target.value },\n                  }))\n                }\n              />\n'''
          if text.count(outcome_block) != 1:
              raise SystemExit("unsupported outcome selector mismatch")
          text = text.replace(outcome_block, '', 1)
          text = text.replace('{titleCase(item.outcome)}', '{titleCase(item.entry_outcome)}', 1)
          old_dates = '''                        {item.is_current\n                          ? "Current"\n                          : formatDate(item.ended_on)}\n'''
          new_dates = '''                        {item.ended_on\n                          ? formatDate(item.ended_on)\n                          : "Current"}\n'''
          if text.count(old_dates) != 1:
              raise SystemExit("history current marker mismatch")
          text = text.replace(old_dates, new_dates, 1)
          old_reason = '''                      {item.reason ? (\n                        <p className="mt-1 text-xs">{item.reason}</p>\n                      ) : null}\n'''
          new_reason = '''                      {item.entry_reason || item.exit_reason ? (\n                        <p className="mt-1 text-xs">\n                          {item.entry_reason || item.exit_reason}\n                        </p>\n                      ) : null}\n'''
          if text.count(old_reason) != 1:
              raise SystemExit("history reason mismatch")
          student_page.write_text(text.replace(old_reason, new_reason, 1))

          # Department UX: assign curriculum subjects to this level's ALD directly.
          dep_page = Path("frontend/src/features/academic-admin/DepartmentsWorkspace.jsx")
          text = dep_page.read_text()
          import_anchor = 'import { getErrorMessage } from "../../services/api";\n'
          if 'from "../../services/curriculumService"' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { curriculumService } from "../../services/curriculumService";\n', 1)
          state_anchor = '  const [levelId, setLevelId] = useState("");\n'
          state_add = state_anchor + '''  const [levelCurriculum, setLevelCurriculum] = useState(null);\n  const [curriculumLoading, setCurriculumLoading] = useState(false);\n  const [curriculumError, setCurriculumError] = useState("");\n'''
          if text.count(state_anchor) != 1:
              raise SystemExit("department state anchor mismatch")
          text = text.replace(state_anchor, state_add, 1)
          load_anchor = '''  useEffect(() => {\n    loadLevelDepartments();\n  }, [loadLevelDepartments]);\n'''
          load_fn = '''  const loadLevelCurriculum = useCallback(async () => {\n    if (activeTab !== "availability" || !levelId) {\n      setLevelCurriculum(null);\n      setCurriculumError("");\n      return;\n    }\n    setCurriculumLoading(true);\n    setCurriculumError("");\n    try {\n      setLevelCurriculum(await curriculumService.getCurriculum(levelId));\n    } catch (error) {\n      setLevelCurriculum(null);\n      setCurriculumError(\n        getErrorMessage(error, "Could not load subject applicability for this level."),\n      );\n    } finally {\n      setCurriculumLoading(false);\n    }\n  }, [activeTab, levelId]);\n\n'''
          if text.count(load_anchor) != 1:
              raise SystemExit("level department effect anchor mismatch")
          text = text.replace(load_anchor, load_fn + load_anchor + '''\n  useEffect(() => {\n    loadLevelCurriculum();\n  }, [loadLevelCurriculum]);\n''', 1)
          memo_anchor = '''  const attachableDepartments = useMemo(\n    () =>\n      departments.filter(\n        (row) =>\n          lifecycleStatus(row) === "active" && !attachedCanonicalIds.has(row.id),\n      ),\n    [attachedCanonicalIds, departments],\n  );\n'''
          memo_add = memo_anchor + '''  const activeLevelDepartments = useMemo(\n    () => levelDepartments.filter((row) => lifecycleStatus(row) === "active"),\n    [levelDepartments],\n  );\n  const selectedLevel = levels.find((row) => row.id === levelId) || null;\n  const curriculumSubjects = levelCurriculum?.subjects || [];\n'''
          if text.count(memo_anchor) != 1:
              raise SystemExit("department memo anchor mismatch")
          text = text.replace(memo_anchor, memo_add, 1)
          action_anchor = '  const runLifecycle = async () => {\n'
          action_fn = '''  const toggleSubjectDepartment = async (subject, levelDepartmentId) => {\n    if (saving || subject.is_active === false) return;\n    const currentIds = (subject.departments || []).map(\n      (item) => item.academic_level_department_id,\n    );\n    const nextIds = currentIds.includes(levelDepartmentId)\n      ? currentIds.filter((id) => id !== levelDepartmentId)\n      : [...currentIds, levelDepartmentId];\n    setSaving(`scope:${subject.id}`);\n    try {\n      await curriculumService.updateSubject(subject.id, {\n        academic_level_department_ids: nextIds,\n      });\n      await loadLevelCurriculum();\n      showSuccess(\n        nextIds.length\n          ? "Subject department applicability updated."\n          : "Subject is now general for this level.",\n      );\n    } catch (error) {\n      showError(\n        getErrorMessage(error, "Could not update subject department applicability."),\n      );\n    } finally {\n      setSaving("");\n    }\n  };\n\n'''
          if text.count(action_anchor) != 1:
              raise SystemExit("department action anchor mismatch")
          text = text.replace(action_anchor, action_fn + action_anchor, 1)
          panel_anchor = '''          </WorkspacePanel>\n          <RecordList\n            title="Level availability"\n'''
          panel = '''          </WorkspacePanel>\n          <WorkspacePanel\n            title="Subjects using this level's departments"\n            description="Assign curriculum subjects to one or more departments for the selected academic level. No department selected means General."\n          >\n            <div className="mb-3 flex flex-wrap items-center justify-between gap-2 text-sm">\n              <span className="font-semibold text-text">\n                {selectedLevel?.name || "Select an academic level"}\n              </span>\n              <span className="text-text-muted">\n                {curriculumSubjects.length} curriculum subject{curriculumSubjects.length === 1 ? "" : "s"}\n              </span>\n            </div>\n            {curriculumLoading ? (\n              <p role="status" className="text-sm text-text-muted">Loading subject applicability...</p>\n            ) : curriculumError ? (\n              <div role="alert" className="space-y-2 text-sm text-error">\n                <p>{curriculumError}</p>\n                <Button type="button" variant="outline" onClick={loadLevelCurriculum}>Retry</Button>\n              </div>\n            ) : !activeLevelDepartments.length ? (\n              <p className="text-sm text-text-muted">Make at least one active department available to this level first.</p>\n            ) : !curriculumSubjects.length ? (\n              <p className="text-sm text-text-muted">Add subjects to this level curriculum before assigning department applicability.</p>\n            ) : (\n              <div className="divide-y divide-border rounded-xl border border-border">\n                {curriculumSubjects.map((subject) => {\n                  const selectedIds = (subject.departments || []).map(\n                    (item) => item.academic_level_department_id,\n                  );\n                  return (\n                    <div key={subject.id} className="grid gap-3 p-3 lg:grid-cols-[minmax(12rem,1fr)_2fr] lg:items-center">\n                      <div>\n                        <p className="text-sm font-semibold text-text">{subject.subject_name || "Subject"}</p>\n                        <p className="mt-1 text-xs text-text-muted">\n                          {selectedIds.length ? "Department scoped" : "General — available to every specialization"}\n                        </p>\n                      </div>\n                      <div className="flex flex-wrap gap-2">\n                        {activeLevelDepartments.map((link) => (\n                          <label key={link.id} className="flex min-h-9 items-center gap-2 rounded-lg border border-border px-3 text-sm">\n                            <input\n                              type="checkbox"\n                              checked={selectedIds.includes(link.id)}\n                              disabled={Boolean(saving) || subject.is_active === false}\n                              onChange={() => toggleSubjectDepartment(subject, link.id)}\n                            />\n                            {link.department_name || "Department"}\n                          </label>\n                        ))}\n                      </div>\n                    </div>\n                  );\n                })}\n              </div>\n            )}\n          </WorkspacePanel>\n          <RecordList\n            title="Level availability"\n'''
          if text.count(panel_anchor) != 1:
              raise SystemExit("department applicability panel anchor mismatch")
          dep_page.write_text(text.replace(panel_anchor, panel, 1))

          # Guide contract regression identified by CI.
          guide = Path("frontend/src/pages/admin/AdminGettingStartedPage.jsx")
          text = guide.read_text()
          import_anchor = 'import Card from "../../components/ui/Card";\n'
          if 'ROLE_GUIDES' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { ROLE_GUIDES } from "../../features/guides/roleGuideConfig";\n', 1)
          replace = '  const steps = guideState.steps;\n'
          if replace in text:
              text = text.replace(replace, '  const visibleStepIds = new Set(guideState.steps.map((step) => step.id));\n  const steps = ROLE_GUIDES.admin.steps.filter((step) => visibleStepIds.has(step.id));\n', 1)
          guide.write_text(text)

          # Prevent/generated test cache artifacts from returning.
          gitignore = Path(".gitignore")
          text = gitignore.read_text()
          ignore = "frontend/.vite-test-cache-*/\n"
          if ignore not in text:
              text += "\n# Frontend test runner caches\n" + ignore
              gitignore.write_text(text)
          for cache in Path("frontend").glob(".vite-test-cache-*"):
              if cache.is_dir():
                  shutil.rmtree(cache)

          # Focused backend regression tests.
          Path("backend/tests/unit/students/test_enrollment_history_contract.py").write_text('''from datetime import date, datetime, timezone\nfrom types import SimpleNamespace\nfrom unittest.mock import AsyncMock, MagicMock, patch\nfrom uuid import uuid4\n\nimport pytest\n\nfrom app.modules.students.enrollment_service import StudentEnrollmentService\nfrom app.modules.students.models import StudentEnrollmentOutcome\nfrom app.modules.students.repository import StudentRepository\n\n\n@pytest.mark.asyncio\nasync def test_history_uses_joined_display_rows_without_class_relationship_lazy_loads():\n    tenant_id, student_id, class_id, level_id, session_id = [uuid4() for _ in range(5)]\n    now = datetime.now(timezone.utc)\n    enrollment = SimpleNamespace(\n        id=uuid4(), tenant_id=tenant_id, student_id=student_id,\n        academic_level_id=level_id, class_id=class_id, academic_session_id=session_id,\n        started_on=date(2026, 9, 1), ended_on=None,\n        entry_outcome=StudentEnrollmentOutcome.ENROLLED, exit_outcome=None,\n        entry_reason="Initial placement", exit_reason=None,\n        created_by_admin_id=None, ended_by_admin_id=None, created_at=now, updated_at=now,\n    )\n\n    class RelationshipTrap:\n        id = class_id\n        def __getattr__(self, name):\n            if name in {"academic_level_name", "academic_level", "arm", "arm_label_ref"}:\n                raise AssertionError(f"unexpected lazy relationship access: {name}")\n            raise AttributeError(name)\n\n    rows = MagicMock()\n    rows.all.return_value = [(\n        enrollment, RelationshipTrap(), SimpleNamespace(name="SS1"),\n        SimpleNamespace(name="2026/27"), SimpleNamespace(label="A"),\n    )]\n    db = SimpleNamespace(execute=AsyncMock(return_value=rows))\n    with patch.object(StudentRepository, "get_by_id", new=AsyncMock(return_value=SimpleNamespace(id=student_id))):\n        history = await StudentEnrollmentService.list_history(db, tenant_id=tenant_id, student_id=student_id)\n\n    assert history[0].class_name == "SS1"\n    assert history[0].class_arm == "A"\n    assert history[0].entry_outcome == StudentEnrollmentOutcome.ENROLLED\n\n\n@pytest.mark.asyncio\nasync def test_class_department_lookup_uses_level_department_identity():\n    tenant_id, class_id, term_id, link_id = [uuid4() for _ in range(4)]\n    result = MagicMock()\n    result.scalar_one_or_none.return_value = link_id\n    db = SimpleNamespace(execute=AsyncMock(return_value=result))\n    resolved = await StudentEnrollmentService._department_for_class(\n        db, tenant_id=tenant_id, class_id=class_id, academic_term_id=term_id\n    )\n    assert resolved == link_id\n    statement = str(db.execute.call_args.args[0])\n    assert "academic_level_department_id" in statement\n''')
          PY
          git rm -r --ignore-unmatch frontend/.vite-test-cache-forms-17088 frontend/.vite-test-cache-forms-1812 || true
      - name: Format and lint focused backend files
        working-directory: backend
        run: |
          uv run ruff format app/modules/students/enrollment_service.py app/modules/student_academics/setup_readiness.py app/modules/student_academics/specialization_workspace.py app/modules/classes/department_repository.py tests/unit/students/test_enrollment_history_contract.py tests/unit/student_academics/test_setup_readiness.py tests/unit/student_academics/test_specialization_workspace.py tests/unit/student_academics/test_curriculum_bulk.py
          uv run ruff check app/modules/students/enrollment_service.py app/modules/student_academics/setup_readiness.py app/modules/student_academics/specialization_workspace.py app/modules/classes/department_repository.py tests/unit/students/test_enrollment_history_contract.py tests/unit/student_academics/test_setup_readiness.py tests/unit/student_academics/test_specialization_workspace.py tests/unit/student_academics/test_curriculum_bulk.py
      - name: Backend focused tests
        working-directory: backend
        run: |
          uv run pytest -q tests/unit/students/test_enrollment_history_contract.py tests/unit/student_academics/test_setup_readiness.py tests/unit/student_academics/test_specialization_workspace.py tests/unit/student_academics/test_curriculum_bulk.py
      - name: Frontend validation
        working-directory: frontend
        run: npm run check
      - name: Remove one-shot workflow and commit fixes
        run: |
          rm -f .github/workflows/agent-review-fix-once.yml
          git config user.name "weave-review-bot"
          git config user.email "weave-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair academic scope and student history flows"
          git push origin HEAD:cbt-sync-module-structure
