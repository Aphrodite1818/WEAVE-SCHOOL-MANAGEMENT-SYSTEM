name: Format teacher assignment fix

on:
  push:
    branches:
      - fix/teacher-assignment-planned-end-handover-20260916

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply formatter and commit
        run: bash scripts/format_teacher_assignment_fix.sh
