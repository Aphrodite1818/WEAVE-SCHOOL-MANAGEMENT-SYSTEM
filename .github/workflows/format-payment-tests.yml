name: Format shared payment tests

on:
  push:
    branches:
      - refactor/shared-payment-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-payment-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format payment tests
        run: |
          python -m pip install --quiet ruff==0.16.0
          ruff format \
            backend/tests/unit/payments/test_service.py \
            backend/tests/unit/payments/test_webhook.py \
            backend/tests/unit/cbt/ai/quota/test_payment_service.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/unit/payments backend/tests/unit/cbt/ai/quota/test_payment_service.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "format shared payment tests"
          git push origin HEAD:refactor/shared-payment-engine
