name: Backend lifecycle checks

on:
  push:
    branches:
      - student_lifecycle
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-lifecycle-checks.yml"

jobs:
  lifecycle-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: development
      SECRET_KEY: test-secret-key-that-is-long-enough-for-ci-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/weave_test
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_APP_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          else
            echo "No backend dependency manifest found" >&2
            exit 1
          fi
          pip install pytest pytest-asyncio

      - name: Compile backend
        run: python -m compileall app

      - name: Import application
        run: python -c "import app.main; print('application import passed')"

      - name: Validate Alembic graph
        run: |
          test "$(alembic heads | grep -c 'head')" -eq 1
          alembic upgrade head

      - name: Run lifecycle smoke tests
        run: pytest -q tests/test_lifecycle_refactor_smoke.py
