name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
  push:
    branches:
      - production-hardening
      - staging
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"

# Temporarily write-enabled only so the one-time baseline freeze job can commit
# the generated explicit migration back to production-hardening. This is restored
# to contents: read after the frozen revision is committed and validated.
permissions:
  contents: write

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-baseline:
    if: github.event_name == 'pull_request' && github.head_ref == 'production-hardening'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weave_baseline"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_baseline
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_baseline
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      TWILIO_ACCOUNT_SID: ci-test-account
      TWILIO_AUTH_TOKEN: ci-test-token
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout production-hardening
        uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Freeze baseline from registered metadata
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Eq 'Base\.metadata|create_all\(' alembic/versions/20260731_clean_baseline.py; then
            echo "Baseline is already explicit; no generation required."
            exit 0
          fi

          uv run python - <<'PY'
          import app.models  # noqa: F401
          from app.shared.base_model import Base

          expected = "public.user_guide_states"
          if expected not in Base.metadata.tables:
              raise RuntimeError(
                  f"ORM registry is incomplete: {expected} is not registered."
              )
          print(f"Registered ORM tables: {len(Base.metadata.tables)}")
          PY

          rm alembic/versions/20260731_clean_baseline.py

          uv run alembic revision \
            --autogenerate \
            --rev-id 20260731_clean_baseline \
            -m "initial production baseline"

          generated_file="$(find alembic/versions -maxdepth 1 -type f -name '20260731_clean_baseline*.py' -print -quit)"
          test -n "$generated_file"

          if [ "$generated_file" != "alembic/versions/20260731_clean_baseline.py" ]; then
            mv "$generated_file" alembic/versions/20260731_clean_baseline.py
          fi

          uv run python - <<'PY'
          from pathlib import Path

          path = Path("alembic/versions/20260731_clean_baseline.py")
          text = path.read_text(encoding="utf-8")
          downgrade_marker = "def downgrade() -> None:"
          if downgrade_marker not in text:
              raise RuntimeError("Generated baseline has no downgrade function")

          prefix = text.split(downgrade_marker, 1)[0].rstrip()
          text = prefix + '''


def downgrade() -> None:
    """Never erase the complete Weave schema through Alembic."""

    raise RuntimeError(
        "Downgrading below the initial Weave production baseline is not "
        "supported. Restore a backup or recreate the database explicitly."
    )
'''
          text = text.replace(
              '"""initial production baseline\n\nRevision ID:',
              '"""Frozen initial production baseline for Weave.\n\nRevision ID:',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          uv run --with ruff ruff format alembic/versions/20260731_clean_baseline.py

          if grep -Eq 'Base\.metadata|create_all\(|import app\.models' alembic/versions/20260731_clean_baseline.py; then
            echo "Generated baseline still depends on live application metadata."
            exit 1
          fi

          rm -f \
            generate_explicit_baseline.py \
            tmp_generate_baseline.py \
            tmp_generate_explicit_baseline.py \
            validate_baseline_temp.py

      - name: Validate frozen baseline on fresh PostgreSQL
        run: |
          uv run --with alembic alembic heads
          uv run --with alembic alembic upgrade head
          uv run --with alembic alembic current
          uv run --with alembic alembic check
          uv run python - <<'PY'
          import asyncio
          from sqlalchemy import inspect
          from app.config.database import engine

          async def main() -> None:
              async with engine.begin() as connection:
                  tables = await connection.run_sync(
                      lambda sync_connection: inspect(sync_connection).get_table_names(
                          schema="public"
                      )
                  )
                  if "user_guide_states" not in tables:
                      raise RuntimeError("Frozen baseline omitted user_guide_states")
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Commit frozen baseline
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/versions/20260731_clean_baseline.py
          git add -u backend
          git commit -m "fix: freeze initial alembic baseline"
          git push origin HEAD:production-hardening

  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      TWILIO_ACCOUNT_SID: ci-test-account
      TWILIO_AUTH_TOKEN: ci-test-token
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show validated revision
        run: |
          git rev-parse HEAD
          git status --short --branch
        working-directory: .

      - name: Resolve validation base
        id: validation-base
        shell: bash
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="origin/${{ github.base_ref }}"
          elif [ "${{ github.ref_name }}" = "production-hardening" ]; then
            base_ref="origin/staging"
          else
            base_ref="HEAD^"
          fi
          git rev-parse "$base_ref"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Repository hygiene
        run: uv run python scripts/verify_repository_hygiene.py

      - name: Lint
        run: uv run --with ruff ruff check .

      - name: Format check for changed Python files
        shell: bash
        env:
          VALIDATION_BASE: ${{ steps.validation-base.outputs.base_ref }}
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$VALIDATION_BASE"...HEAD -- ../backend \
              | sed 's#^backend/##' \
              | grep -E '\.py$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files to format-check."
            exit 0
          fi
          uv run --with ruff ruff format --check "${files[@]}"

      - name: Type check changed production files
        shell: bash
        env:
          VALIDATION_BASE: ${{ steps.validation-base.outputs.base_ref }}
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$VALIDATION_BASE"...HEAD -- ../backend \
              | sed 's#^backend/##' \
              | grep -E '\.py$' \
              | grep -Ev '^(tests/|alembic/versions/)' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed production Python files to type-check."
            exit 0
          fi
          uv run --with pyright pyright "${files[@]}"

      - name: Alembic heads
        run: uv run --with alembic alembic heads

      - name: Alembic history
        run: uv run --with alembic alembic history

      - name: Upgrade fresh database
        run: uv run --with alembic alembic upgrade head

      - name: Alembic drift check
        shell: bash
        run: |
          if uv run --with alembic alembic check; then
            exit 0
          fi

          echo "Alembic detected drift. Comparing metadata and PostgreSQL foreign keys:"
          uv run python scripts/inspect_foreign_key_drift.py
          exit 1

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests
        run: uv run pytest tests/integration

      - name: Application import check
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Worker import checks
        run: |
          uv run python -c "from app.core.queue.general_worker import WorkerSettings; print(WorkerSettings.queue_name)"
          uv run python -c "from app.core.queue.heavy_worker import WorkerSettings; print(WorkerSettings.queue_name)"
