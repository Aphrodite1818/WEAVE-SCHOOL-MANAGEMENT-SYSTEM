name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
  push:
    branches:
      - production-hardening
      - staging
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      REDIS_URL: redis://127.0.0.1:6379/0
      RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/1
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      TWILIO_ACCOUNT_SID: ci-test-account
      TWILIO_AUTH_TOKEN: ci-test-token
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show validated revision
        run: |
          git rev-parse HEAD
          git status --short --branch
        working-directory: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Repository hygiene
        run: uv run python scripts/verify_repository_hygiene.py

      - name: Lint
        run: uv run --with ruff ruff check .

      - name: Format check
        run: uv run --with ruff ruff format --check .

      - name: Type check
        run: uv run --with pyright pyright app

      - name: Alembic heads
        run: uv run --with alembic alembic heads

      - name: Alembic history
        run: uv run --with alembic alembic history

      - name: Upgrade fresh database
        run: uv run --with alembic alembic upgrade head

      - name: Alembic drift check
        run: uv run --with alembic alembic check

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests
        run: uv run pytest tests/integration

      - name: Application import check
        run: uv run python -c "from app.main import app; print(app.title)"

      - name: Worker import checks
        run: |
          uv run python -c "from app.core.queue.general_worker import WorkerSettings; print(WorkerSettings.queue_name)"
          uv run python -c "from app.core.queue.heavy_worker import WorkerSettings; print(WorkerSettings.queue_name)"
