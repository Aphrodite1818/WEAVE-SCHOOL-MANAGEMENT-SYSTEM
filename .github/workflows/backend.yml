name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"
  push:
    branches:
      - staging
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "docker-compose.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weave_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_test
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      TWILIO_ACCOUNT_SID: ci-test-account
      TWILIO_AUTH_TOKEN: ci-test-token
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run --with ruff ruff check .

      - name: Format check
        run: uv run --with ruff ruff format --check .
        continue-on-error: true

      - name: Type check
        run: uv run --with pyright pyright
        continue-on-error: true

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Alembic heads
        run: uv run alembic heads

      - name: Alembic history
        run: uv run alembic history

      - name: Alembic check
        run: uv run alembic check
        continue-on-error: true

      - name: Application import check
        run: uv run python -c "from app.main import app; print(app.title)"
