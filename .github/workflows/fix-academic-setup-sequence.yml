name: Fix academic setup sequence

on:
  push:
    branches:
      - Attendance
    paths:
      - ".github/workflows/fix-academic-setup-sequence.yml"
      - ".github/scripts/fix_academic_setup_sequence.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Attendance
        uses: actions/checkout@v4
        with:
          ref: Attendance
          fetch-depth: 0

      - name: Apply backend-safe setup sequence
        run: python .github/scripts/fix_academic_setup_sequence.py

      - name: Commit corrected setup flow
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/features/guides/roleGuideConfig.js \
            frontend/src/features/guides/roleGuideConfig.test.js \
            frontend/src/pages/admin/AdminGettingStartedPage.jsx
          git commit -m "fix: align school setup with backend lifecycle"
          git push origin HEAD:Attendance
