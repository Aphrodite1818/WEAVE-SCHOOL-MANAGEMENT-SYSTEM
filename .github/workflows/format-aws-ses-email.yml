name: Format AWS SES email branch

on:
  push:
    branches:
      - feature/aws-ses-email
    paths:
      - "backend/**/*.py"
      - ".github/workflows/format-aws-ses-email.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/aws-ses-email
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Format changed backend Python files
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/master...HEAD -- ../backend \
              | sed 's#^backend/##' \
              | grep -E '\.py$' || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed backend Python files to format."
            exit 0
          fi

          uv run ruff format "${files[@]}"

      - name: Commit formatting
        working-directory: .
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: format email migration"
          git push origin HEAD:feature/aws-ses-email
