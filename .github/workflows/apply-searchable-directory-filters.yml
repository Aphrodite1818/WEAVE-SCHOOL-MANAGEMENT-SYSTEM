name: Apply searchable directory filters

on:
  push:
    branches:
      - Attendance
    paths:
      - ".github/workflows/apply-searchable-directory-filters.yml"
      - ".github/scripts/apply_searchable_directory_filters.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Attendance
        uses: actions/checkout@v4
        with:
          ref: Attendance
          fetch-depth: 0

      - name: Apply filter patch
        run: python .github/scripts/apply_searchable_directory_filters.py

      - name: Commit filter patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "feat: add searchable resource and directory filters"
          git push origin HEAD:Attendance
