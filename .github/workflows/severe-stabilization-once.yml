name: Severe stabilization one-shot

on:
  push:
    branches:
      - cbt-sync-module-structure

permissions:
  contents: write

jobs:
  severe-stabilization:
    if: contains(github.event.head_commit.message, '[run-severe-stabilization]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d weave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: development
      SECRET_KEY: test-secret-key-that-is-long-enough-for-ci-only
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/weave_test
      REDIS_URL: redis://localhost:6379/0
      FRONTEND_APP_URL: http://localhost:3000
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script

    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply deterministic severe source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          service_path = Path("backend/app/modules/student_academics/service.py")
          service = service_path.read_text()
          helper_pattern = re.compile(
              r"\n    @staticmethod\n    async def _specialization_blockers_for_next_term\(.*?\n    # ------------------------------------------------------------------\n    # Session and term lifecycle",
              re.S,
          )
          service, count = helper_pattern.subn(
              "\n    # ------------------------------------------------------------------\n    # Session and term lifecycle",
              service,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"next-term specialization helper: expected 1 match, found {count}")

          old = "            (\n                specialization_counts,\n                specialization_blockers,\n            ) = await StudentAcademicService._specialization_blockers_for_next_term(\n                db, tenant_id=tenant_id, term=term\n            )\n            counts.update(specialization_counts)\n            blockers.extend(specialization_blockers)\n"
          service = replace_once(service, old, "", "remove future specialization close blocker")

          old = "        await TermPlanEntitlementService.ensure_open_eligible(db, tenant_id, term.id)\n"
          new = "        entitlement = await TermPlanEntitlementService.ensure_open_eligible(\n            db, tenant_id, term.id\n        )\n"
          service = replace_once(service, old, new, "capture opening entitlement")

          old = "            term = await StudentAcademicRepository.save_academic_term(db, term)\n            await StudentAcademicService._record_academic_lifecycle(\n"
          new = "            term = await StudentAcademicRepository.save_academic_term(db, term)\n            await TermPlanEntitlementService.mark_effective_for_open_term(\n                db,\n                tenant_id=tenant_id,\n                term=term,\n                entitlement=entitlement,\n            )\n            await StudentAcademicService._record_academic_lifecycle(\n"
          service = replace_once(service, old, new, "sync plan snapshot on term open")

          old = "        await db.commit()\n        return term\n\n    @staticmethod\n    async def start_academic_term_closure(\n"
          new = "        await db.commit()\n        from app.modules.subscriptions.cache import invalidate_tenant_subscription_cache\n\n        await invalidate_tenant_subscription_cache(tenant_id)\n        return term\n\n    @staticmethod\n    async def start_academic_term_closure(\n"
          service = replace_once(service, old, new, "invalidate entitlement cache after opening")
          service_path.write_text(service)

          entitlement_path = Path("backend/app/modules/subscriptions/term_entitlement_service.py")
          entitlement_service = entitlement_path.read_text()
          marker = "    @staticmethod\n    async def close_for_term(\n"
          method = (
              "    @staticmethod\n"
              "    async def mark_effective_for_open_term(\n"
              "        db: AsyncSession,\n"
              "        *,\n"
              "        tenant_id: uuid.UUID,\n"
              "        term: AcademicTerm,\n"
              "        entitlement: TermPlanEntitlement,\n"
              "    ) -> None:\n"
              "        \"\"\"Synchronize the legacy tenant plan snapshot only when a term becomes effective.\n\n"
              "        TermPlanEntitlement plus the current OPEN term remain authoritative for access.\n"
              "        tenant.plan is only a compatibility snapshot for remaining presentation/read paths.\n"
              "        \"\"\"\n"
              "        if (\n"
              "            term.tenant_id != tenant_id\n"
              "            or term.status != AcademicTermStatus.OPEN\n"
              "            or not term.is_current\n"
              "        ):\n"
              "            raise ConflictException(\n"
              "                \"A term entitlement can only become effective for the current open term.\"\n"
              "            )\n"
              "        if (\n"
              "            entitlement.tenant_id != tenant_id\n"
              "            or entitlement.academic_term_id != term.id\n"
              "            or entitlement.status != TermEntitlementStatus.ACTIVE\n"
              "        ):\n"
              "            raise ConflictException(\n"
              "                \"The selected entitlement does not belong to the current open term.\"\n"
              "            )\n"
              "        tenant = await SubscriptionRepository.get_tenant(db, tenant_id)\n"
              "        if tenant is None:\n"
              "            raise NotFoundException(\"Tenant not found.\")\n"
              "        tenant.plan = coerce_subscription_plan(entitlement.plan_code)\n"
              "        tenant.initial_plan_intent = None\n"
              "        tenant.trial_ends_at = None\n"
              "        await db.flush()\n\n"
          )
          entitlement_service = replace_once(
              entitlement_service,
              marker,
              method + marker,
              "insert open-term effective snapshot helper",
          )
          entitlement_path.write_text(entitlement_service)

          curriculum_path = Path("backend/app/modules/student_academics/curriculum_v2_service.py")
          curriculum = curriculum_path.read_text()
          old = "        if target.status in {AcademicTermStatus.CLOSING, AcademicTermStatus.CLOSED}:\n            raise ConflictException(\"Cannot copy specialization into a closing or closed term.\")\n"
          new = "        if target.status != AcademicTermStatus.DRAFT:\n            raise ConflictException(\n                \"Specializations can only be copied into a draft academic term.\"\n            )\n"
          curriculum = replace_once(curriculum, old, new, "restrict specialization copy to draft")

          old = "                    term=current_term,\n                    acting_admin_id=None,\n"
          new = "                    term=current_term,\n                    acting_admin_id=None,\n                    transition_boundary=date.today(),\n"
          curriculum = replace_once(curriculum, old, new, "scope transition boundary")

          old = "                acting_admin_id=admin_id,\n                class_ids={class_id},\n"
          new = "                acting_admin_id=admin_id,\n                class_ids={class_id},\n                transition_boundary=date.today(),\n"
          curriculum = replace_once(curriculum, old, new, "class specialization transition boundary")

          old = "                term=current_term,\n                acting_admin_id=admin_id,\n            )\n        db.add(\n"
          new = "                term=current_term,\n                acting_admin_id=admin_id,\n                transition_boundary=date.today(),\n            )\n        db.add(\n"
          curriculum = replace_once(curriculum, old, new, "policy transition boundary")

          pattern = re.compile(
              r"    @staticmethod\n    async def reconcile_teacher_assignments_for_term\(.*?        return \{\"ended\": ended, \"deleted_scheduled\": 0\}\n",
              re.S,
          )
          replacement = (
              "    @staticmethod\n"
              "    async def reconcile_teacher_assignments_for_term(\n"
              "        db: AsyncSession,\n"
              "        *,\n"
              "        tenant_id: uuid.UUID,\n"
              "        term: AcademicTerm,\n"
              "        acting_admin_id: uuid.UUID | None,\n"
              "        class_ids: set[uuid.UUID] | None = None,\n"
              "        transition_boundary: date | None = None,\n"
              "    ) -> dict[str, int]:\n"
              "        \"\"\"End started assignments that lose eligibility without rewriting scheduled history.\"\"\"\n\n"
              "        query = select(TeacherAssignment).where(\n"
              "            TeacherAssignment.tenant_id == tenant_id,\n"
              "            TeacherAssignment.effective_to.is_(None),\n"
              "        )\n"
              "        if term.end_date is not None:\n"
              "            query = query.where(TeacherAssignment.effective_from <= term.end_date)\n"
              "        if class_ids:\n"
              "            query = query.where(TeacherAssignment.class_id.in_(class_ids))\n"
              "        assignments = list((await db.execute(query.with_for_update())).scalars())\n"
              "        boundary = transition_boundary or term.start_date or date.today()\n"
              "        if term.start_date is not None and boundary < term.start_date:\n"
              "            boundary = term.start_date\n\n"
              "        cache: dict[uuid.UUID, set[uuid.UUID]] = {}\n"
              "        ineligible: list[TeacherAssignment] = []\n"
              "        for assignment in assignments:\n"
              "            eligible = cache.get(assignment.class_id)\n"
              "            if eligible is None:\n"
              "                try:\n"
              "                    resolved = await CurriculumResolutionService.resolve_class_subjects(\n"
              "                        db,\n"
              "                        tenant_id=tenant_id,\n"
              "                        class_id=assignment.class_id,\n"
              "                        academic_term_id=term.id,\n"
              "                    )\n"
              "                    eligible = {item.curriculum_subject_id for item in resolved}\n"
              "                except (ConflictException, NotFoundException):\n"
              "                    eligible = set()\n"
              "                cache[assignment.class_id] = eligible\n"
              "            if assignment.curriculum_subject_id not in eligible:\n"
              "                ineligible.append(assignment)\n\n"
              "        scheduled_conflicts = [\n"
              "            assignment\n"
              "            for assignment in ineligible\n"
              "            if assignment.effective_from >= boundary\n"
              "        ]\n"
              "        if scheduled_conflicts:\n"
              "            raise ConflictException(\n"
              "                \"A scheduled teacher assignment would become ineligible at this academic transition. \"\n"
              "                \"Remove or reschedule it explicitly before changing the specialization context.\",\n"
              "                payload={\n"
              "                    \"code\": \"SCHEDULED_TEACHER_ASSIGNMENT_CONFLICT\",\n"
              "                    \"transition_boundary\": boundary.isoformat(),\n"
              "                    \"dependency_counts\": {\n"
              "                        \"scheduled_teacher_assignments\": len(scheduled_conflicts)\n"
              "                    },\n"
              "                    \"teacher_assignment_ids\": [\n"
              "                        str(assignment.id) for assignment in scheduled_conflicts\n"
              "                    ],\n"
              "                },\n"
              "            )\n\n"
              "        ended = 0\n"
              "        for assignment in ineligible:\n"
              "            previous_state = assignment.state.value\n"
              "            effective_to = boundary - timedelta(days=1)\n"
              "            assignment.effective_to = effective_to\n"
              "            db.add(assignment)\n"
              "            db.add(\n"
              "                TeacherAssignmentLifecycleAudit(\n"
              "                    tenant_id=tenant_id,\n"
              "                    assignment_id=assignment.id,\n"
              "                    class_id=assignment.class_id,\n"
              "                    curriculum_subject_id=assignment.curriculum_subject_id,\n"
              "                    action=\"specialization_assignment_ended\",\n"
              "                    previous_teacher_membership_id=assignment.teacher_membership_id,\n"
              "                    new_teacher_membership_id=assignment.teacher_membership_id,\n"
              "                    previous_state=previous_state,\n"
              "                    new_state=\"ended\",\n"
              "                    previous_effective_from=assignment.effective_from,\n"
              "                    previous_effective_to=None,\n"
              "                    new_effective_from=assignment.effective_from,\n"
              "                    new_effective_to=effective_to,\n"
              "                    acting_admin_id=acting_admin_id,\n"
              "                    reason=\"Subject is no longer eligible for the class in the target specialization context.\",\n"
              "                )\n"
              "            )\n"
              "            ended += 1\n"
              "        await db.flush()\n"
              "        return {\"ended\": ended, \"deleted_scheduled\": 0}\n"
          )
          curriculum, count = pattern.subn(replacement, curriculum, count=1)
          if count != 1:
              raise SystemExit(f"teacher reconciliation replacement: expected 1 match, found {count}")
          curriculum_path.write_text(curriculum)

          term_test_path = Path("backend/tests/unit/student_academics/test_academic_term_update.py")
          term_test = term_test_path.read_text()
          old = "        patch(\n            \"app.modules.subscriptions.term_entitlement_service.TermPlanEntitlementService.ensure_open_eligible\",\n            new=AsyncMock(),\n        ),\n"
          new = old + "        patch(\n            \"app.modules.subscriptions.term_entitlement_service.TermPlanEntitlementService.mark_effective_for_open_term\",\n            new=AsyncMock(),\n        ),\n        patch(\n            \"app.modules.subscriptions.cache.invalidate_tenant_subscription_cache\",\n            new=AsyncMock(),\n        ),\n"
          term_test = replace_once(term_test, old, new, "patch open-term entitlement collaborators in existing test")
          term_test_path.write_text(term_test)
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile backend
        working-directory: backend
        run: python -m compileall app tests/unit/student_academics/test_severe_stabilization.py tests/unit/subscriptions/test_term_open_effective_snapshot.py

      - name: Validate Alembic graph and schema
        working-directory: backend
        run: |
          test "$(alembic heads | grep -c 'head')" -eq 1
          alembic upgrade head

      - name: Run severe focused tests
        working-directory: backend
        run: |
          pytest -q \
            tests/unit/student_academics/test_severe_stabilization.py \
            tests/unit/student_academics/test_academic_term_update.py \
            tests/unit/student_academics/test_class_term_department_lifecycle.py \
            tests/unit/student_academics/test_teacher_assignment_lifecycle.py \
            tests/unit/subscriptions/test_term_open_effective_snapshot.py \
            tests/unit/subscriptions/test_term_entitlements.py

      - name: Commit verified fixes and remove executor
        run: |
          rm .github/workflows/severe-stabilization-once.yml
          git config user.name weave-stabilization-bot
          git config user.email weave-stabilization-bot@users.noreply.github.com
          git add backend .github/workflows/severe-stabilization-once.yml
          git diff --cached --check
          git commit -m 'fix: stabilize academic lifecycle and term entitlements'
          git push origin HEAD:cbt-sync-module-structure
