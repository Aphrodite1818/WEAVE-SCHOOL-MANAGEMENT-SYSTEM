name: Apply reviewed frontend release fixes

on:
  push:
    branches: [Attendance]
    paths:
      - .github/workflows/one-time-frontend-release-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Attendance
          fetch-depth: 0

      - name: Apply targeted frontend fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Reusable session/term filter for student and parent report-card workspaces.
          Path("frontend/src/components/shared/ReportCardPeriodFilters.jsx").write_text(
              '''import { useEffect, useMemo } from "react";\n\nfunction uniqueOptions(cards, idKey, labelKey) {\n  const seen = new Set();\n  return (cards || []).reduce((options, card) => {\n    const value = card?.[idKey];\n    if (!value || seen.has(value)) return options;\n    seen.add(value);\n    options.push({ value, label: card?.[labelKey] || "Unknown" });\n    return options;\n  }, []);\n}\n\nexport function filterReportCardsByPeriod(cards, sessionId, termId) {\n  return (cards || []).filter(\n    (card) =>\n      (!sessionId || card.academic_session_id === sessionId) &&\n      (!termId || card.academic_term_id === termId),\n  );\n}\n\nfunction ReportCardPeriodFilters({\n  cards,\n  sessionId,\n  termId,\n  onSessionChange,\n  onTermChange,\n}) {\n  const sessions = useMemo(\n    () => uniqueOptions(cards, "academic_session_id", "academic_session_name"),\n    [cards],\n  );\n  const terms = useMemo(\n    () =>\n      uniqueOptions(\n        (cards || []).filter(\n          (card) => !sessionId || card.academic_session_id === sessionId,\n        ),\n        "academic_term_id",\n        "academic_term_name",\n      ),\n    [cards, sessionId],\n  );\n\n  useEffect(() => {\n    if (termId && !terms.some((term) => term.value === termId)) {\n      onTermChange("");\n    }\n  }, [onTermChange, termId, terms]);\n\n  return (\n    <div className="grid gap-3 sm:grid-cols-2">\n      <label className="block text-sm font-semibold text-text-soft">\n        <span className="mb-1.5 block">Academic session</span>\n        <select\n          className="input-base"\n          value={sessionId}\n          onChange={(event) => {\n            onSessionChange(event.target.value);\n            onTermChange("");\n          }}\n        >\n          <option value="">All sessions</option>\n          {sessions.map((session) => (\n            <option key={session.value} value={session.value}>\n              {session.label}\n            </option>\n          ))}\n        </select>\n      </label>\n      <label className="block text-sm font-semibold text-text-soft">\n        <span className="mb-1.5 block">Academic term</span>\n        <select\n          className="input-base"\n          value={termId}\n          onChange={(event) => onTermChange(event.target.value)}\n        >\n          <option value="">All terms</option>\n          {terms.map((term) => (\n            <option key={term.value} value={term.value}>\n              {term.label}\n            </option>\n          ))}\n        </select>\n      </label>\n    </div>\n  );\n}\n\nexport default ReportCardPeriodFilters;\n''',
              encoding="utf-8",
          )

          # Report-card service accepts backend session/term filters.
          replace_once(
              "frontend/src/services/reportCardService.js",
              '''  listMyReportCards: (requestOptions) =>\n    api.get("/students/me/academic/report-cards", requestOptions),''',
              '''  listMyReportCards: (params = {}, requestOptions) =>\n    api.get(`/students/me/academic/report-cards${queryString(params)}`, requestOptions),''',
          )
          replace_once(
              "frontend/src/services/reportCardService.js",
              '''  listChildReportCards: (studentId, requestOptions) =>\n    api.get(`/parents/me/children/${studentId}/academic/report-cards`, requestOptions),''',
              '''  listChildReportCards: (studentId, params = {}, requestOptions) =>\n    api.get(\n      `/parents/me/children/${studentId}/academic/report-cards${queryString(params)}`,\n      requestOptions,\n    ),''',
          )

          # Student report-card filters.
          replace_once(
              "frontend/src/pages/student/StudentReportCardsPage.jsx",
              'import { useEffect, useState } from "react";',
              'import { useEffect, useMemo, useState } from "react";',
          )
          replace_once(
              "frontend/src/pages/student/StudentReportCardsPage.jsx",
              'import ReportCardPrintSheet from "../../components/shared/ReportCardPrintSheet";',
              'import ReportCardPrintSheet from "../../components/shared/ReportCardPrintSheet";\nimport ReportCardPeriodFilters, { filterReportCardsByPeriod } from "../../components/shared/ReportCardPeriodFilters";',
          )
          replace_once(
              "frontend/src/pages/student/StudentReportCardsPage.jsx",
              '''  const [printId, setPrintId] = useState(null);\n  const [printCard, setPrintCard] = useState(null);''',
              '''  const [printId, setPrintId] = useState(null);\n  const [printCard, setPrintCard] = useState(null);\n  const [sessionFilter, setSessionFilter] = useState("");\n  const [termFilter, setTermFilter] = useState("");\n  const filteredReportCards = useMemo(\n    () => filterReportCardsByPeriod(reportCards, sessionFilter, termFilter),\n    [reportCards, sessionFilter, termFilter],\n  );''',
          )
          replace_once(
              "frontend/src/pages/student/StudentReportCardsPage.jsx",
              '''      {loadError && (\n        <div className="rounded-[1.35rem] border border-error/30 bg-error-soft px-4 py-3 text-sm font-medium text-error">\n          {loadError}\n        </div>\n      )}\n\n      {!loadError && reportCards.length === 0 && (''',
              '''      {loadError && (\n        <div className="rounded-[1.35rem] border border-error/30 bg-error-soft px-4 py-3 text-sm font-medium text-error">\n          {loadError}\n        </div>\n      )}\n\n      {!loadError && reportCards.length > 0 && (\n        <Card className="p-5 sm:p-6">\n          <div className="mb-4">\n            <h2 className="text-base font-semibold text-text">Filter report cards</h2>\n            <p className="mt-1 text-sm text-text-muted">Choose a session and term to find an older published report quickly.</p>\n          </div>\n          <ReportCardPeriodFilters\n            cards={reportCards}\n            sessionId={sessionFilter}\n            termId={termFilter}\n            onSessionChange={setSessionFilter}\n            onTermChange={setTermFilter}\n          />\n        </Card>\n      )}\n\n      {!loadError && reportCards.length === 0 && (''',
          )
          replace_once(
              "frontend/src/pages/student/StudentReportCardsPage.jsx",
              "      {!loadError && reportCards.length > 0 && (\n        <section className=\"space-y-4\">\n          {reportCards.map((card) => {",
              "      {!loadError && reportCards.length > 0 && filteredReportCards.length === 0 && (\n        <Card className=\"p-5 sm:p-6\">\n          <EmptyState icon={FileText} title=\"No report cards match these filters\" description=\"Choose another academic session or term.\" />\n        </Card>\n      )}\n\n      {!loadError && filteredReportCards.length > 0 && (\n        <section className=\"space-y-4\">\n          {filteredReportCards.map((card) => {",
          )

          # Parent report-card filters, reset when the selected child changes.
          replace_once(
              "frontend/src/pages/parent/ParentReportCardsPage.jsx",
              'import ReportCardPrintSheet from "../../components/shared/ReportCardPrintSheet";',
              'import ReportCardPrintSheet from "../../components/shared/ReportCardPrintSheet";\nimport ReportCardPeriodFilters, { filterReportCardsByPeriod } from "../../components/shared/ReportCardPeriodFilters";',
          )
          replace_once(
              "frontend/src/pages/parent/ParentReportCardsPage.jsx",
              '''  const [printId, setPrintId] = useState(null);\n  const [printCard, setPrintCard] = useState(null);''',
              '''  const [printId, setPrintId] = useState(null);\n  const [printCard, setPrintCard] = useState(null);\n  const [sessionFilter, setSessionFilter] = useState("");\n  const [termFilter, setTermFilter] = useState("");\n  const filteredReportCards = useMemo(\n    () => filterReportCardsByPeriod(reportCards, sessionFilter, termFilter),\n    [reportCards, sessionFilter, termFilter],\n  );''',
          )
          replace_once(
              "frontend/src/pages/parent/ParentReportCardsPage.jsx",
              '''        setReportCards(response?.items || []);\n        setExpandedId(null);''',
              '''        setReportCards(response?.items || []);\n        setExpandedId(null);\n        setSessionFilter("");\n        setTermFilter("");''',
          )
          replace_once(
              "frontend/src/pages/parent/ParentReportCardsPage.jsx",
              '''      {selectedChildRecord && isLoadingCards && (\n        <LoadingState label="Loading report cards..." />\n      )}\n\n      {selectedChildRecord && !isLoadingCards && reportCards.length === 0 && (''',
              '''      {selectedChildRecord && isLoadingCards && (\n        <LoadingState label="Loading report cards..." />\n      )}\n\n      {selectedChildRecord && !isLoadingCards && reportCards.length > 0 && (\n        <Card className="p-5 sm:p-6">\n          <div className="mb-4">\n            <h2 className="text-base font-semibold text-text">Filter report cards</h2>\n            <p className="mt-1 text-sm text-text-muted">Choose the session and term you want to review for this child.</p>\n          </div>\n          <ReportCardPeriodFilters\n            cards={reportCards}\n            sessionId={sessionFilter}\n            termId={termFilter}\n            onSessionChange={setSessionFilter}\n            onTermChange={setTermFilter}\n          />\n        </Card>\n      )}\n\n      {selectedChildRecord && !isLoadingCards && reportCards.length === 0 && (''',
          )
          replace_once(
              "frontend/src/pages/parent/ParentReportCardsPage.jsx",
              "      {selectedChildRecord && !isLoadingCards && reportCards.length > 0 && (\n        <section className=\"space-y-4\">\n          {reportCards.map((card) => {",
              "      {selectedChildRecord && !isLoadingCards && reportCards.length > 0 && filteredReportCards.length === 0 && (\n        <Card className=\"p-5 sm:p-6\">\n          <EmptyState icon={FileText} title=\"No report cards match these filters\" description=\"Choose another academic session or term.\" />\n        </Card>\n      )}\n\n      {selectedChildRecord && !isLoadingCards && filteredReportCards.length > 0 && (\n        <section className=\"space-y-4\">\n          {filteredReportCards.map((card) => {",
          )

          # Subscription service and billing cancellation experience.
          replace_once(
              "frontend/src/services/subscriptionService.js",
              '''  initializeSubscriptionCheckout: (payload) =>\n    api.post("/subscriptions/checkout", payload),''',
              '''  cancelCurrentSubscription: (payload) =>\n    api.post("/subscriptions/cancel", payload),\n\n  initializeSubscriptionCheckout: (payload) =>\n    api.post("/subscriptions/checkout", payload),''',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              'import { Link } from "react-router-dom";',
              'import { useState } from "react";\nimport { Link } from "react-router-dom";',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '''  AlertTriangle,\n  CalendarClock,''',
              '''  AlertTriangle,\n  Ban,\n  CalendarClock,''',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              'import Button from "../../components/ui/Button";',
              'import Button from "../../components/ui/Button";\nimport Modal from "../../components/ui/Modal";',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              'import { useSubscription } from "../../features/subscriptions/useSubscription";',
              'import { useSubscription } from "../../features/subscriptions/useSubscription";\nimport { subscriptionService } from "../../services/subscriptionService";\nimport { getErrorMessage } from "../../services/api";',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '  if (normalizedStatus === "cancelled" || normalizedStatus === "canceled") {',
              '  if (["cancelled", "canceled", "non_renewing"].includes(normalizedStatus)) {',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '''    isLoading,\n    errors,\n  } = useSubscription();''',
              '''    isLoading,\n    errors,\n    refreshSubscriptionState,\n  } = useSubscription();\n  const [cancelOpen, setCancelOpen] = useState(false);\n  const [cancelReason, setCancelReason] = useState("");\n  const [cancelError, setCancelError] = useState("");\n  const [isCancelling, setIsCancelling] = useState(false);''',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '''  const renewalLabel = getRenewalLabel(daysUntilRenewal, rawStatus);\n\n  if (isLoading && !currentSubscription && !entitlements) {''',
              '''  const renewalLabel = getRenewalLabel(daysUntilRenewal, rawStatus);\n  const normalizedStatus = String(rawStatus || "").toLowerCase();\n  const isNonRenewing = normalizedStatus === "non_renewing" || Boolean(currentSubscription?.cancel_at_period_end);\n  const canCancel = normalizedStatus === "active" && !isNonRenewing;\n\n  const cancelSubscription = async () => {\n    setCancelError("");\n    setIsCancelling(true);\n    try {\n      await subscriptionService.cancelCurrentSubscription({\n        confirmation: "CANCEL_SUBSCRIPTION",\n        reason: cancelReason.trim() || undefined,\n      });\n      await refreshSubscriptionState({ silent: true });\n      setCancelOpen(false);\n      setCancelReason("");\n    } catch (error) {\n      setCancelError(getErrorMessage(error, "Could not cancel automatic renewal."));\n    } finally {\n      setIsCancelling(false);\n    }\n  };\n\n  if (isLoading && !currentSubscription && !entitlements) {''',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '''        {isAttentionRequired ? <div className="rounded-2xl border border-warning/30 bg-warning-soft px-4 py-3 text-sm font-medium text-amber-700"><span className="flex items-start gap-2"><AlertTriangle className="mt-0.5 h-4 w-4 shrink-0" /><span>Your subscription needs attention. Review your billing status or continue to plan upgrade.</span></span></div> : null}\n''',
              '''        {isAttentionRequired ? <div className="rounded-2xl border border-warning/30 bg-warning-soft px-4 py-3 text-sm font-medium text-amber-700"><span className="flex items-start gap-2"><AlertTriangle className="mt-0.5 h-4 w-4 shrink-0" /><span>Your subscription needs attention. Review your billing status or continue to plan upgrade.</span></span></div> : null}\n        {isNonRenewing ? <div className="rounded-2xl border border-info/30 bg-info-soft px-4 py-3 text-sm font-medium text-info"><span className="flex items-start gap-2"><Ban className="mt-0.5 h-4 w-4 shrink-0" /><span>Automatic renewal is cancelled. Your paid access remains active until {formatDateTime(renewalDate)}.</span></span></div> : null}\n        {cancelError ? <div className="rounded-2xl border border-error/30 bg-error-soft px-4 py-3 text-sm font-medium text-error">{cancelError}</div> : null}\n''',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '''            <div className="mt-6 grid gap-3"><Link to="/admin/billing/plans" className="block"><Button className="w-full">Upgrade Plan</Button></Link><Link to="/admin/usage" className="block"><Button variant="outline" className="w-full">View Usage</Button></Link></div>''',
              '''            <div className="mt-6 grid gap-3">\n              <Link to="/admin/billing/plans" className="block"><Button className="w-full">Upgrade Plan</Button></Link>\n              <Link to="/admin/usage" className="block"><Button variant="outline" className="w-full">View Usage</Button></Link>\n              {canCancel ? (\n                <Button type="button" variant="outline" className="w-full" onClick={() => setCancelOpen(true)}>\n                  <Ban className="h-4 w-4" /> Cancel automatic renewal\n                </Button>\n              ) : null}\n            </div>''',
          )
          replace_once(
              "frontend/src/pages/admin/BillingPage.jsx",
              '''      </div>\n    </DashboardLayout>''',
              '''        <Modal\n          open={cancelOpen}\n          title="Cancel automatic renewal?"\n          description="You will keep your current paid features until the end of the billing period. Paystack will not charge the next renewal."\n          onClose={() => {\n            if (!isCancelling) {\n              setCancelOpen(false);\n              setCancelError("");\n            }\n          }}\n          closeOnOverlay={!isCancelling}\n          footer={(\n            <div className="flex justify-end gap-2">\n              <Button type="button" variant="outline" disabled={isCancelling} onClick={() => setCancelOpen(false)}>Keep subscription</Button>\n              <Button type="button" variant="danger" disabled={isCancelling} onClick={cancelSubscription}>\n                {isCancelling ? "Cancelling..." : "Cancel renewal"}\n              </Button>\n            </div>\n          )}\n        >\n          <label className="block text-sm font-semibold text-text-soft">\n            <span className="mb-1.5 block">Reason (optional)</span>\n            <textarea\n              className="input-base min-h-24 resize-y"\n              value={cancelReason}\n              onChange={(event) => setCancelReason(event.target.value)}\n              placeholder="Tell us why you are cancelling"\n              maxLength={500}\n            />\n          </label>\n        </Modal>\n      </div>\n    </DashboardLayout>''',
          )

          # Message deep links, read-state sync, and teacher-facing sender identity.
          replace_once(
              "frontend/src/pages/shared/MessagesPage.jsx",
              'import { useCallback, useEffect, useMemo, useState } from "react";',
              'import { useCallback, useEffect, useMemo, useState } from "react";\nimport { useSearchParams } from "react-router-dom";',
          )
          replace_once(
              "frontend/src/pages/shared/MessagesPage.jsx",
              'import { messageService } from "../../services/communicationService";',
              'import { emitNotificationsChanged, messageService } from "../../services/communicationService";',
          )
          replace_once(
              "frontend/src/pages/shared/MessagesPage.jsx",
              '''export default function MessagesPage() {\n  const [conversations, setConversations] = useState([]);''',
              '''export default function MessagesPage() {\n  const [searchParams] = useSearchParams();\n  const requestedConversationId = searchParams.get("conversation") || "";\n  const [conversations, setConversations] = useState([]);''',
          )
          replace_once(
              "frontend/src/pages/shared/MessagesPage.jsx",
              '  const [selectedId, setSelectedId] = useState("");',
              '  const [selectedId, setSelectedId] = useState(requestedConversationId);',
          )
          replace_once(
              "frontend/src/pages/shared/MessagesPage.jsx",
              '''    messageService.getConversation(selectedId)\n      .then((response) => {\n        if (mounted) setSelected(response);\n      })''',
              '''    messageService.markRead(selectedId)\n      .then((response) => {\n        if (mounted) {\n          setSelected(response);\n          emitNotificationsChanged();\n          setConversations((current) =>\n            current.map((conversation) =>\n              conversation.id === response.id ? { ...conversation, unread_count: 0 } : conversation,\n            ),\n          );\n        }\n      })''',
          )
          replace_once(
              "frontend/src/pages/shared/MessagesPage.jsx",
              '''                      <p className={`mb-1 text-[11px] font-bold uppercase ${mine ? "text-white/75" : "text-text-faint"}`}>\n                        {identityLabel(sender, currentActorKey, { useSelfLabel: false })}\n                      </p>''',
              '''                      <div className={`mb-1 text-[11px] font-bold uppercase ${mine ? "text-white/75" : "text-text-faint"}`}>\n                        <p>{identityLabel(sender, currentActorKey, { useSelfLabel: false })}</p>\n                        {dashboardRole === "teacher" ? (\n                          <p className={`mt-0.5 normal-case tracking-normal ${mine ? "text-white/65" : "text-text-muted"}`}>\n                            Sender ID: {message.sender_actor_id}\n                          </p>\n                        ) : null}\n                      </div>''',
          )

          Path(".github/workflows/one-time-frontend-release-fixes.yml").unlink()
          PY

      - name: Commit reviewed frontend fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: complete cancellation messaging and report-card filters"
          git push origin HEAD:Attendance
