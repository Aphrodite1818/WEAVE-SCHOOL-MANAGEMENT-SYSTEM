name: Apply guide exit navigation fix

on:
  pull_request:
    branches:
      - Attendance
    paths:
      - ".github/scripts/apply_guide_exit_navigation_fix.py"
      - ".github/workflows/apply-guide-exit-navigation-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply navigation patch
        run: python .github/scripts/apply_guide_exit_navigation_fix.py

      - name: Update legacy navigation contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/navigationAndGuideContracts.test.js")
          content = path.read_text(encoding="utf-8")
          old = '  assert.match(setupPage, /navigate\\("\\/admin\\/billing\\/plans"\\)/);\n'
          new = '''  assert.match(
            setupPage,
            /leaveGuideRoute\\("admin", "\\/admin\\/billing\\/plans", \\{ replace: true \\}\\)/,
          );
          '''
          if old not in content:
              raise SystemExit("Legacy billing navigation assertion was not found")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove one-shot patch files
        run: |
          rm .github/scripts/apply_guide_exit_navigation_fix.py
          rm .github/workflows/apply-guide-exit-navigation-fix.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        run: npm run check

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend .github/scripts .github/workflows
          git commit -m "fix: make guided setup exit navigation reliable"
          git push origin HEAD:${{ github.head_ref }}
