name: Remove calendar history placeholder once

on:
  push:
    branches: [cbt-sync-module-structure]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: contains(github.event.head_commit.message, '[remove-calendar-history-placeholder]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Remove unsupported calendar history UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          config = Path('frontend/src/features/academic-admin/academicWorkflowConfig.js')
          text = config.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '      { id: "closures", label: "Closures" },\n      { id: "history", label: "History" },\n',
              '      { id: "closures", label: "Closures" },\n',
              'calendar history tab',
          )
          config.write_text(text, encoding='utf-8')

          workspace = Path('frontend/src/features/schoolCalendar/components/SchoolCalendarWorkspace.jsx')
          text = workspace.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''      {activeTab === "history" ? (\n        <WorkspacePanel title="History" description="Calendar activity history will appear here when this view is available.">\n          <p className="text-sm text-text-muted">Calendar changes are recorded automatically as you update settings, days, closures, and events.</p>\n        </WorkspacePanel>\n      ) : null}\n\n''',
              '',
              'calendar history placeholder panel',
          )
          text = replace_once(
              text,
              '        description="The event will no longer appear as an active school event. Calendar history remains available."\n',
              '        description="The event will remain stored as cancelled and will no longer appear as an active school event."\n',
              'cancel event history copy',
          )
          workspace.write_text(text, encoding='utf-8')

          test = Path('frontend/test/calendar-history-surface-contract.test.js')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst config = fs.readFileSync(\n  new URL("../src/features/academic-admin/academicWorkflowConfig.js", import.meta.url),\n  "utf8",\n);\nconst workspace = fs.readFileSync(\n  new URL("../src/features/schoolCalendar/components/SchoolCalendarWorkspace.jsx", import.meta.url),\n  "utf8",\n);\n\ntest("school calendar does not expose unsupported history UI", () => {\n  const calendarSection = config.slice(config.indexOf('"school-calendar"'), config.indexOf('academicToneStyles'));\n  assert.doesNotMatch(calendarSection, /id:\\s*["']history["']/);\n  assert.doesNotMatch(workspace, /activeTab === ["']history["']/);\n  assert.doesNotMatch(workspace, /Calendar activity history will appear here/);\n  assert.doesNotMatch(workspace, /Calendar history remains available/);\n});\n\ntest("cancelled event copy only promises persisted cancellation state", () => {\n  assert.match(\n    workspace,\n    /The event will remain stored as cancelled and will no longer appear as an active school event\\./,\n  );\n});\n''', encoding='utf-8')
          PY
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Validate frontend
        working-directory: frontend
        run: npm run check
      - name: Commit calendar history cleanup
        run: |
          rm -f .github/workflows/remove-calendar-history-placeholder-once.yml
          git config user.name "weave-review-bot"
          git config user.email "weave-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove unsupported calendar history surface"
          git push origin HEAD:cbt-sync-module-structure
