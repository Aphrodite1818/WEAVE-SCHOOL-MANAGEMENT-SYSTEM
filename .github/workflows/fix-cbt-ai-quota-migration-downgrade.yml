name: Fix CBT AI quota migration downgrade

on:
  push:
    branches:
      - refactor/shared-payment-engine

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weave_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weave_migration"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ENV: dev
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-48-characters-for-tests
      BULK_IMPORT_RESULT_ENCRYPTION_KEY: ci-only-bulk-import-encryption-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/weave_migration
      FRONTEND_APP_URL: http://localhost:5174
      APP_SCRIPT_URL: http://localhost:3000/mock-app-script
      ALLOWED_ORIGINS: '["http://localhost:5174"]'
      CACHE_ENABLED: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-payment-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Patch and verify downgrade cycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/alembic/versions/20260930_cbt_ai_quota_add_cbt_ai_quota_accounting.py")
          text = path.read_text()
          import_needle = "import sqlalchemy as sa\n"
          import_addition = "import sqlalchemy as sa\nfrom sqlalchemy.dialects import postgresql\n"
          if "from sqlalchemy.dialects import postgresql" not in text:
              if import_needle not in text:
                  raise SystemExit("SQLAlchemy import insertion point not found")
              text = text.replace(import_needle, import_addition, 1)

          end_needle = '    op.drop_table("cbt_ai_tenant_credit_balances", schema="public")\n    # ### end Alembic commands ###\n'
          enum_cleanup = '''    op.drop_table("cbt_ai_tenant_credit_balances", schema="public")\n\n    # PostgreSQL enum types survive table drops unless removed explicitly.\n    # Remove them so downgrade -> upgrade cycles are repeatable.\n    for enum_name in (\n        "cbt_ai_credit_ledger_event_type",\n        "cbt_ai_credit_ledger_bucket",\n        "cbt_ai_quota_request_status",\n        "cbt_ai_credit_reservation_status",\n        "cbt_ai_quota_purchase_status",\n        "ai_quota_actor_type",\n    ):\n        postgresql.ENUM(name=enum_name, schema="public").drop(\n            op.get_bind(),\n            checkfirst=True,\n        )\n    # ### end Alembic commands ###\n'''
          if "PostgreSQL enum types survive table drops" not in text:
              if end_needle not in text:
                  raise SystemExit("Migration downgrade insertion point not found")
              text = text.replace(end_needle, enum_cleanup, 1)
          path.write_text(text)
          PY
          cd backend
          uv run ruff format alembic/versions/20260930_cbt_ai_quota_add_cbt_ai_quota_accounting.py
          uv run alembic upgrade head
          uv run alembic downgrade 20260927_elective_groups
          uv run alembic upgrade head
          uv run alembic check
      - name: Commit migration hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/alembic/versions/20260930_cbt_ai_quota_add_cbt_ai_quota_accounting.py
          git commit -m "harden CBT AI quota migration downgrade"
          git push origin HEAD:refactor/shared-payment-engine
