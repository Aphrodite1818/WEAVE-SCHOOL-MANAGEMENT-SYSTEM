name: Targeted academic refactor implementation

on:
  push:
    branches:
      - academic-level-class-subscription-refactor
    paths:
      - .github/workflows/targeted-refactor-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: academic-level-class-subscription-refactor
          fetch-depth: 0

      - name: Trace placement and progression dashboard copy
        run: |
          grep -R -n -E "Academic progression|Your next class has been assigned|Next class assigned|placement" frontend/src backend/app | head -n 200 || true

      - name: Apply targeted invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:100]!r}")
              save(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = load(path)
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected >= {minimum} matches, found {count}: {old[:100]!r}")
              save(path, text.replace(old, new))

          def inject_async_guard(path, function_names, guard_line):
              lines = load(path).splitlines(keepends=True)
              for name in function_names:
                  start = next((i for i, line in enumerate(lines) if line.startswith(f"    async def {name}(")), None)
                  if start is None:
                      raise RuntimeError(f"{path}: function {name} not found")
                  end = start
                  while not lines[end].rstrip().endswith(":"):
                      end += 1
                  if end + 1 < len(lines) and guard_line.strip() in lines[end + 1]:
                      continue
                  lines.insert(end + 1, guard_line)
              save(path, "".join(lines))

          # Academic/class structural writes must honor the CLOSING freeze even
          # when called outside HTTP route dependencies.
          path = "backend/app/modules/classes/service.py"
          text = load(path)
          import_anchor = "from app.modules.parents.models import Parent\n"
          guard_import = "from app.modules.student_academics.write_guard import ensure_academic_write_window\n"
          if guard_import not in text:
              if import_anchor not in text:
                  raise RuntimeError("classes service import anchor missing")
              text = text.replace(import_anchor, import_anchor + guard_import, 1)
          text = text.replace(
              "        AcademicLevelService._ensure_admin(actor)\n",
              "        AcademicLevelService._ensure_admin(actor)\n        await ensure_academic_write_window(db, tenant_id=actor.tenant_id)\n",
          )
          text = text.replace(
              "        ClassRoomService._ensure_tenant_admin(actor)\n",
              "        ClassRoomService._ensure_tenant_admin(actor)\n        await ensure_academic_write_window(db, tenant_id=actor.tenant_id)\n",
          )
          text = text.replace("        limit = min(limit, 100)\n", "        limit = min(limit, 500)\n", 1)
          dependency_anchor = """        new_level_id = update_data.get(\"academic_level_id\", classroom.academic_level_id)\n        new_arm = update_data.get(\"arm\", classroom.arm)\n        new_normalized_arm = normalized_class_arm_key(new_arm)\n\n"""
          dependency_block = dependency_anchor + """        if new_level_id != classroom.academic_level_id:\n            dependency_counts = await ClassRoomRepository.count_class_dependencies(\n                db=db,\n                tenant_id=actor.tenant_id,\n                class_id=classroom.id,\n            )\n            if any(dependency_counts.values()):\n                raise ConflictException(\n                    \"Academic level cannot be changed after this class has academic history.\",\n                    payload={\"dependency_counts\": dependency_counts},\n                )\n\n"""
          if dependency_block not in text:
              if dependency_anchor not in text:
                  raise RuntimeError("class level mutation anchor missing")
              text = text.replace(dependency_anchor, dependency_block, 1)
          save(path, text)

          # Level-subject and teacher-assignment structural writes use the same
          # domain-level guard rather than depending solely on router wiring.
          path = "backend/app/modules/student_academics/service.py"
          text = load(path)
          anchor = "from app.modules.students.models import Student, StudentParentLinkStatus\n"
          guard_import = "from app.modules.student_academics.write_guard import ensure_academic_write_window\n"
          if guard_import not in text:
              if anchor not in text:
                  raise RuntimeError("student academic service import anchor missing")
              text = text.replace(anchor, guard_import + anchor, 1)
              save(path, text)
          inject_async_guard(
              path,
              [
                  "create_level_subject",
                  "create_level_subjects_bulk",
                  "deactivate_level_subject",
                  "activate_level_subject",
                  "update_level_subject",
                  "archive_level_subject",
                  "restore_level_subject",
                  "delete_level_subject",
                  "create_teacher_assignment",
                  "end_teacher_assignment",
                  "reassign_teacher_assignment",
              ],
              "        await ensure_academic_write_window(db, tenant_id=tenant_id)\n",
          )
          text = load(path)
          text = text.replace(
              "        if effective_from < current.effective_from:\n            raise ConflictException(\n                \"Replacement effective date cannot be before the current assignment start date.\"\n            )\n",
              "        if effective_from <= current.effective_from:\n            raise ConflictException(\n                \"Replacement effective date must be after the current assignment start date to avoid overlapping assignment history.\"\n            )\n",
              1,
          )
          text = text.replace(
              "        current.effective_to = (\n            effective_from\n            if effective_from == current.effective_from\n            else effective_from - timedelta(days=1)\n        )\n",
              "        current.effective_to = effective_from - timedelta(days=1)\n",
              1,
          )
          save(path, text)

          # A current OPEN or CLOSING period is still the tenant's current
          # academic period. Never allow a second current session/term while
          # closure is underway.
          path = "backend/app/modules/student_academics/repository.py"
          text = load(path)
          text = text.replace(
              "                    AcademicSession.status == AcademicSessionStatus.OPEN,\n",
              "                    AcademicSession.status.in_(\n                        {AcademicSessionStatus.OPEN, AcademicSessionStatus.CLOSING}\n                    ),\n",
              1,
          )
          text = text.replace(
              "                    AcademicTerm.status == AcademicTermStatus.OPEN,\n",
              "                    AcademicTerm.status.in_(\n                        {AcademicTermStatus.OPEN, AcademicTermStatus.CLOSING}\n                    ),\n",
              1,
          )
          save(path, text)

          path = "backend/app/modules/student_academics/lifecycle_repository.py"
          text = load(path)
          text = text.replace(
              "            AcademicSession.status == AcademicSessionStatus.OPEN,\n",
              "            AcademicSession.status.in_(\n                {AcademicSessionStatus.OPEN, AcademicSessionStatus.CLOSING}\n            ),\n",
              1,
          )
          old_add = """    @staticmethod\n    async def add(db: AsyncSession, item: StudentProgressionItem) -> StudentProgressionItem:\n        db.add(item)\n        await db.flush()\n        return item\n"""
          new_add = """    @staticmethod\n    async def add(db: AsyncSession, item: StudentProgressionItem) -> StudentProgressionItem:\n        \"\"\"Create or update the one logical progression item for a student/run.\"\"\"\n\n        existing = await StudentProgressionItemRepository.get_by_run_and_student(\n            db,\n            item.progression_run_id,\n            item.student_id,\n            lock=True,\n        )\n        if existing is not None:\n            for field in (\n                \"tenant_id\",\n                \"from_enrollment_id\",\n                \"to_enrollment_id\",\n                \"from_class_id\",\n                \"to_class_id\",\n                \"action\",\n                \"status\",\n                \"reason\",\n                \"processed_at\",\n            ):\n                setattr(existing, field, getattr(item, field))\n            db.add(existing)\n            await db.flush()\n            return existing\n\n        db.add(item)\n        await db.flush()\n        return item\n"""
          if new_add not in text:
              if old_add not in text:
                  raise RuntimeError("progression item add anchor missing")
              text = text.replace(old_add, new_add, 1)
          save(path, text)

          path = "backend/app/modules/student_academics/models.py"
          text = load(path)
          old = 'postgresql_where=text("is_current = true AND status = \'open\'"),'
          new = 'postgresql_where=text("is_current = true AND status IN (\'open\', \'closing\')"),'
          count = text.count(old)
          if count != 2:
              raise RuntimeError(f"expected two current-period partial indexes, found {count}")
          save(path, text.replace(old, new))

          # Retry progression against unresolved enrollments without deleting
          # history or shrinking the original cohort/counters.
          path = "backend/app/modules/student_academics/session_closure_service.py"
          text = load(path)
          old = """            run.status = StudentProgressionRunStatus.PENDING\n            run.total_students = len(enrollments)\n            run.promoted_students = 0\n            run.graduated_students = 0\n            run.skipped_students = 0\n            run.failed_students = 0\n            run.started_at = None\n"""
          new = """            run.status = StudentProgressionRunStatus.PENDING\n            if run.total_students == 0:\n                run.total_students = len(enrollments)\n            run.started_at = None\n"""
          if old not in text:
              raise RuntimeError("start-closing retry reset anchor missing")
          text = text.replace(old, new, 1)
          old = """        run.total_students = len(enrollments)\n        run.promoted_students = 0\n        run.graduated_students = 0\n        run.skipped_students = 0\n        run.failed_students = 0\n        effective_date = session.end_date or date.today()\n"""
          new = """        if run.total_students == 0:\n            run.total_students = len(enrollments)\n        effective_date = session.end_date or date.today()\n"""
          if old not in text:
              raise RuntimeError("progression processing counter reset anchor missing")
          text = text.replace(old, new, 1)
          old = """                db.add(\n                    StudentProgressionItem(\n                        tenant_id=tenant_id,\n                        progression_run_id=run.id,\n                        student_id=enrollment.student_id,\n                        from_enrollment_id=enrollment.id,\n                        from_class_id=enrollment.class_id,\n                        to_class_id=None,\n                        action=StudentProgressionItemAction.SKIP,\n                        status=StudentProgressionItemStatus.FAILED,\n                        reason=str(exc)[:1000],\n                        processed_at=_utc_now(),\n                    )\n                )\n                await db.flush()\n\n        run.status = (\n            StudentProgressionRunStatus.FAILED\n            if run.failed_students > 0\n            else StudentProgressionRunStatus.COMPLETED\n        )\n        run.completed_at = _utc_now()\n        run.failure_reason = (\n            f\"{run.failed_students} student progression item(s) failed.\"\n            if run.failed_students\n            else None\n        )\n"""
          new = """                await StudentProgressionRepository.add_item(\n                    db,\n                    StudentProgressionItem(\n                        tenant_id=tenant_id,\n                        progression_run_id=run.id,\n                        student_id=enrollment.student_id,\n                        from_enrollment_id=enrollment.id,\n                        from_class_id=enrollment.class_id,\n                        to_class_id=None,\n                        action=StudentProgressionItemAction.SKIP,\n                        status=StudentProgressionItemStatus.FAILED,\n                        reason=str(exc)[:1000],\n                        processed_at=_utc_now(),\n                    ),\n                )\n\n        persisted_items = await StudentProgressionRepository.list_items_for_run(\n            db, tenant_id, run.id\n        )\n        run.promoted_students = sum(\n            item.status == StudentProgressionItemStatus.PROMOTED for item in persisted_items\n        )\n        run.graduated_students = sum(\n            item.status == StudentProgressionItemStatus.GRADUATED for item in persisted_items\n        )\n        run.skipped_students = sum(\n            item.status == StudentProgressionItemStatus.SKIPPED for item in persisted_items\n        )\n        run.failed_students = sum(\n            item.status == StudentProgressionItemStatus.FAILED for item in persisted_items\n        )\n        incomplete_students = max(run.total_students - len(persisted_items), 0)\n        run.status = (\n            StudentProgressionRunStatus.FAILED\n            if run.failed_students > 0 or incomplete_students > 0\n            else StudentProgressionRunStatus.COMPLETED\n        )\n        run.completed_at = _utc_now()\n        run.failure_reason = (\n            f\"{run.failed_students} failed and {incomplete_students} incomplete student progression item(s).\"\n            if run.status == StudentProgressionRunStatus.FAILED\n            else None\n        )\n"""
          if old not in text:
              raise RuntimeError("progression failure persistence anchor missing")
          text = text.replace(old, new, 1)
          save(path, text)

          # Every retry receives a fresh queue-attempt identity while the
          # progression run itself remains the business idempotency boundary.
          path = "backend/app/core/queue/arq.py"
          text = load(path)
          if "import uuid\n" not in text:
              text = text.replace("from __future__ import annotations\n\n", "from __future__ import annotations\n\nimport uuid\n", 1)
          text = text.replace(
              '    if retry:\n        job_id = f"{job_id}:retry"\n',
              '    if retry:\n        job_id = f"{job_id}:retry:{uuid.uuid4().hex}"\n',
              1,
          )
          save(path, text)

          # Historical report cards resolve class/curriculum from the student's
          # enrollment for the requested academic session, never current class_id.
          path = "backend/app/modules/report_cards/service.py"
          text = load(path)
          text = text.replace(
              "from sqlalchemy.ext.asyncio import AsyncSession\n",
              "from sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n",
              1,
          )
          text = text.replace(
              "from app.modules.students.models import Student\n",
              "from app.modules.students.models import Student, StudentEnrollment\n",
              1,
          )
          old = """        if student.class_id is None:\n            raise BadRequestException(\"Student class is required for report card generation.\")\n        if not results:\n            raise BadRequestException(\"No locked scores are available for this student.\")\n\n        missing = await ReportCardService._missing_subjects(\n            db,\n            actor.tenant_id,\n            student.class_id,\n"""
          new = """        enrollment = (\n            await db.execute(\n                select(StudentEnrollment).where(\n                    StudentEnrollment.tenant_id == actor.tenant_id,\n                    StudentEnrollment.student_id == student.id,\n                    StudentEnrollment.academic_session_id == academic_session_id,\n                )\n            )\n        ).scalar_one_or_none()\n        if enrollment is None:\n            raise BadRequestException(\n                \"Student enrollment for this academic session is required for report card generation.\"\n            )\n        class_id = enrollment.class_id\n        if not results:\n            raise BadRequestException(\"No locked scores are available for this student.\")\n\n        missing = await ReportCardService._missing_subjects(\n            db,\n            actor.tenant_id,\n            class_id,\n"""
          if old not in text:
              raise RuntimeError("report card class resolution anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace("            class_id=student.class_id,\n", "            class_id=class_id,\n", 1)
          text = text.replace(
              "        if student is None or student.class_id is None:\n            raise NotFoundException(\"Student or student class not found.\")\n",
              "        if student is None:\n            raise NotFoundException(\"Student not found.\")\n",
              1,
          )
          text = text.replace(
              "            student.class_id,\n            academic_session_id,\n            academic_term_id,\n        )\n        await db.commit()\n",
              "            card.class_id,\n            academic_session_id,\n            academic_term_id,\n        )\n        await db.commit()\n",
              1,
          )
          save(path, text)

          # Regression tests for the high-risk invariants added in this pass.
          Path("backend/tests/test_academic_refactor_regressions.py").write_text(r'''from __future__ import annotations

from types import SimpleNamespace
from unittest.mock import AsyncMock
import uuid

import pytest

from app.modules.student_academics.lifecycle_repository import StudentProgressionItemRepository
from app.modules.student_academics.models import (
    StudentProgressionItem,
    StudentProgressionItemAction,
    StudentProgressionItemStatus,
)


@pytest.mark.asyncio
async def test_progression_item_retry_updates_existing_logical_item(monkeypatch):
    run_id = uuid.uuid4()
    student_id = uuid.uuid4()
    existing_id = uuid.uuid4()
    existing = SimpleNamespace(
        id=existing_id,
        tenant_id=uuid.uuid4(),
        progression_run_id=run_id,
        student_id=student_id,
        from_enrollment_id=None,
        to_enrollment_id=None,
        from_class_id=None,
        to_class_id=None,
        action=StudentProgressionItemAction.SKIP,
        status=StudentProgressionItemStatus.FAILED,
        reason="first failure",
        processed_at=None,
    )
    monkeypatch.setattr(
        StudentProgressionItemRepository,
        "get_by_run_and_student",
        AsyncMock(return_value=existing),
    )
    db = SimpleNamespace(add=lambda item: None, flush=AsyncMock())
    incoming = StudentProgressionItem(
        tenant_id=existing.tenant_id,
        progression_run_id=run_id,
        student_id=student_id,
        action=StudentProgressionItemAction.PROMOTE,
        status=StudentProgressionItemStatus.PROMOTED,
        reason="retry succeeded",
    )

    saved = await StudentProgressionItemRepository.add(db, incoming)

    assert saved is existing
    assert saved.id == existing_id
    assert saved.status == StudentProgressionItemStatus.PROMOTED
    assert saved.reason == "retry succeeded"
    db.flush.assert_awaited_once()


def test_current_period_partial_indexes_cover_closing_state():
    from app.modules.student_academics.models import AcademicSession, AcademicTerm

    session_index = next(
        item for item in AcademicSession.__table__.indexes
        if item.name == "uq_academic_sessions_current_per_tenant"
    )
    term_index = next(
        item for item in AcademicTerm.__table__.indexes
        if item.name == "uq_academic_terms_current_per_tenant"
    )
    assert "closing" in str(session_index.dialect_options["postgresql"]["where"])
    assert "closing" in str(term_index.dialect_options["postgresql"]["where"])


def test_fresh_baseline_must_not_follow_live_orm_metadata():
    from pathlib import Path

    migration = Path("alembic/versions/20260811_fresh_schema_baseline.py").read_text()
    assert "Base.metadata.create_all" not in migration
    assert "Base.metadata.drop_all" not in migration
''')
          PY

      - name: Python syntax check
        run: python -m compileall -q backend/app backend/tests/test_academic_refactor_regressions.py

      - name: Remove one-off implementation workflow
        run: rm .github/workflows/targeted-refactor-implementation.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden academic lifecycle invariants and retries"
          git push origin HEAD:academic-level-class-subscription-refactor
