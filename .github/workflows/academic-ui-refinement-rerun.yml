name: Academic UI refinement rerun

on:
  push:
    branches: [cbt-sync-module-structure]

permissions:
  contents: write

jobs:
  refine-and-validate:
    if: contains(github.event.head_commit.message, '[academic-ui-rerun]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbt-sync-module-structure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Apply reviewed refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/academic-ui-refinement-once.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Validate frontend"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Could not locate reviewed refinement script')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), '<academic-ui-refinement>', 'exec'))

          path = Path('frontend/src/features/academic-admin/DepartmentsWorkspace.jsx')
          text = path.read_text()
          text = text.replace('import { Building2, Link2 } from "lucide-react";\n', '')
          text = text.replace('  RecordList,\n', '', 1)
          path.write_text(text)
          PY
      - name: Validate frontend
        working-directory: frontend
        run: npm run check
      - name: Commit refinements
        run: |
          rm -f .github/workflows/academic-ui-refinement-once.yml
          rm -f .github/workflows/academic-ui-refinement-rerun.yml
          git config user.name "weave-review-bot"
          git config user.email "weave-review-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify specialization and curriculum UI"
          git push origin HEAD:cbt-sync-module-structure
